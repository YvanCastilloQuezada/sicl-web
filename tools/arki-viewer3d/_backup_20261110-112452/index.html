<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ARKI F1–F11 · Visor 3D</title>
<link rel="stylesheet" href="/styles.css">
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="canvas-host"></div>
  <aside id="sidebar">
    <h1>ARKI · F1–F11</h1>
    <label>Corrida / alternativa:
      <select id="run-select"></select>
    </label>
    <div id="status-bar">Cargando…</div>
    <div id="alt-label" class="alt"></div>
    <div id="legend"></div>

    <div id="panel"><p>Haz clic en un piso.</p></div>

    <!-- ⑪ F11 · cuadro de pruebas libres -->
    <div id="f11-panel">
      <h3>⑪ F11 · Cuadro de pruebas</h3>
      <textarea id="f11-text" placeholder="Escribe aquí tu prueba, nota o criterio…

Ejemplos:
• 'verificar que D6.2 genera IFC4 válido'
• 'probar familia paramétrica ventana 1.2x1.5'
• 'revisar persistencia SQLite MO22'"></textarea>
      <select id="f11-target">
        <option value="">— sin fase —</option>
        <option value="F1">F1</option><option value="F2">F2</option>
        <option value="F3">F3</option><option value="F4">F4</option>
        <option value="F5">F5</option><option value="F6">F6</option>
        <option value="F7">F7</option><option value="F8">F8</option>
        <option value="F9">F9</option><option value="F10">F10</option>
      </select>
      <button id="f11-send">Registrar prueba</button>
      <div id="f11-list"></div>
    </div>
  </aside>
</div>
<script type="module" src="/viewer.js"></script>
</body>
</html>
