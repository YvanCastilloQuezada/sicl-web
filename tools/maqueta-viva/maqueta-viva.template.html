x}.phase span{display:block;font-size:12px;color:var(--muted);margin-top:6px}.phase.selected{outline:2px solid var(--accent)}.phase.frozen{border-left-color:var(--green)}.phase.progress{border-left-color:var(--amber)}.phase.reconciled{border-left-color:var(--blue)}.phase.unknown{border-left-color:#708298}

/* Local integration preparation is declarative only, never a verification mechanism. */
.review-box{background:rgba(5,28,47,.35);border:1px solid #4f84a8;border-radius:10px;padding:12px;margin-top:14px}
.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.review-grid label{font-size:12px;color:#d3e6f3;display:grid;gap:4px}
.review-grid label.wide{grid-column:1/-1}
.review-grid input{width:100%;min-width:0;padding:8px;background:#102c44;border:1px solid #6388a4;border-radius:6px;color:#fff;font-size:12px}
.review-gates{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.review-gates span{border-radius:6px;padding:5px 8px;font-size:11px}
.gate-ready{border:1px solid #7594a8;color:#c4e2f4;background:#25445c}
.gate-pending{border:1px solid #9a7958;color:#f2d5b6;background:#45372e}
@media(max-width:680px){.review-grid{grid-template-columns:1fr}}
/* Local puzzle assembly: proposals only, never canonical integration */

.placement-action{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.placement-action label{font-size:12px;color:#d3e6f3}
.placement-action select{background:#122d45;color:#fff;border:1px solid #85b3d1;border-radius:7px;padding:7px;max-width:100%}
.action-primary{background:#f2d94e;color:#181812;border:1px solid #d6b83b;border-radius:7px;padding:7px 11px;font-weight:700;cursor:pointer}
.action-primary:hover{background:#ffed79}
.placed-piece{border-left:4px solid #f2d94e!important}.layout>.center.drag-over{outline:3px dashed #ffe379;outline-offset:-8px;background:linear-gradient(160deg,#265c7d,#1c4b6a,#1b4261)}.item[draggable="true"]{cursor:grab}.item[draggable="true"]:active{cursor:grabbing}
/* Single compact command bar: fixed left statistics, independently centered orange menu, right search. */
.commandbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:5px 9px;margin-bottom:10px;background:#14243a;border:1px solid var(--line);border-radius:10px;min-height:43px}

.command-tabs .tray-menu{background:#f2d94e;color:#171713;border-color:#c9ad2d}.command-tabs .tray-menu.active{background:#ffed79;color:#14140f;border:2px solid #fff4aa;padding:5px 9px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}.command-tabs .tray-menu:hover{background:#ffed79;color:#171713;border-color:#fff2a0}
.commandbar input{justify-self:end;min-width:125px;width:clamp(125px,13vw,200px);max-width:100%;padding:6px 9px;font-size:12px;border-radius:6px}

.phase-menu{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin:0 0 9px;padding:7px;background:#132339;border:1px solid var(--line);border-radius:10px}
.phase-menu-button{min-width:0;min-height:45px;padding:5px 3px;background:#1b3049;color:#e7f1fb;border:1px solid #455b74;border-bottom:3px solid #77869a;border-radius:7px;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.25}

.layout{grid-template-columns:minmax(0,1fr) minmax(235px,290px)}.layout .right{padding:14px 11px}.layout>.center{min-height:calc(100vh - 240px)}

.workbench-piece strong{font-size:12px}.workbench-piece span{font-size:13px;overflow-wrap:anywhere}.workbench-piece small{font-size:10px;color:#d4e9f4;margin-top:auto}.workbench-piece.selected{outline:2px solid #f2d94e}.workbench-piece:hover{background:#2d6489}
@media(max-width:1200px){.layout{grid-template-columns:minmax(0,1fr) minmax(210px,250px)}}
@media(max-width:850px){.layout{grid-template-columns:minmax(0,1fr)}.layout .center{order:1}.layout .right{order:2}.sidebar{position:static;max-height:none}.phase-menu{display:flex;overflow-x:auto}.phase-menu-button{flex:0 0 91px}}

#right .item strong,.workbench-piece strong,.workbench-piece span{color:#c8ff43}

#right .item.selected-piece strong,.layout>.center .workbench-piece.selected-piece strong,.layout>.center .workbench-piece.selected-piece span{color:#8ff4dd}

#right .item:focus-visible,.layout>.center .workbench-piece:focus-visible{outline:2px solid #8ff4dd;outline-offset:2px}

.phase-menu-button[data-phase="F3"]{--phase-color:#8c710f}

.phase-menu-button[data-phase="F5"]{--phase-color:#16765b}
.phase-menu-button[data-phase="F6"]{--phase-color:#13798b}
.phase-menu-button[data-phase="F7"]{--phase-color:#315db4}
.phase-menu-button[data-phase="F8"]{--phase-color:#6849a3}
.phase-menu-button[data-phase="F9"]{--phase-color:#9a3889}

.phase-menu-button{background:var(--phase-color,#1b3049);color:#fff;border-color:rgba(255,255,255,.32);border-bottom-width:3px}

/* Focus mode hides only the visual tray, not its pieces, phases, or roadmap. */
.layout.focus-mode{grid-template-columns:minmax(0,1fr)}
.layout.focus-mode>.right{display:none}

/* Protected, source-driven roadmap: phase color is identity, not completion. */
.roadmap-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}
.roadmap-head h2{margin:3px 0}.roadmap-head .hint{max-width:670px}
.roadmap-stats{display:flex;gap:6px;flex-wrap:wrap}.roadmap-stats span{font-size:11px;border:1px solid #678ba6;border-radius:6px;padding:6px 9px;background:#102b45}
.roadmap-current{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:13px 0;padding:12px;background:#11334f;border:1px solid #507b9a;border-radius:9px}
.roadmap-current strong{color:#f1faff}.roadmap-current span{color:#c4e9ff}.roadmap-current small{width:100%;color:#c4d6e7;line-height:1.5}
.roadmap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px;margin:13px 0}
.roadmap-phase{display:flex;flex-direction:column;gap:10px;min-height:170px;text-align:left;padding:12px;border:1px solid #648ba5;border-top:5px solid var(--phase-color,#7eabc4);border-radius:10px;background:#17344f;color:#edf6ff}
.roadmap-phase:hover{background:#225273;outline:1px solid #b4e2ff}
.roadmap-phase-top{display:flex;gap:8px;align-items:center}.roadmap-phase-top strong{background:var(--phase-color,#527f9c);color:white;padding:6px 8px;border-radius:6px}.roadmap-phase-top span{font-size:13px;font-weight:700}
.roadmap-phase small{color:#c0d8e9;font-size:11px;overflow-wrap:anywhere}.roadmap-status{font-size:10px;font-weight:750;overflow-wrap:anywhere;color:#d7e9f7}
.roadmap-status.frozen{color:#71dfac}.roadmap-status.progress{color:#ffd087}.roadmap-status.reconciled{color:#b0c9ff}
.roadmap-draft{margin-top:auto;font-size:11px;color:#d9ebf8}.roadmap-open{font-size:11px;font-weight:700;color:#8edbff}
.roadmap-foot{margin-top:16px;padding:12px;border:1px solid #496b87;border-radius:9px}
.roadmap-phase[data-roadmap-phase="F1"]{--phase-color:#a73540}
.roadmap-phase[data-roadmap-phase="F2"]{--phase-color:#a65a20}
.roadmap-phase[data-roadmap-phase="F3"]{--phase-color:#8c710f}
.roadmap-phase[data-roadmap-phase="F4"]{--phase-color:#4f7927}
.roadmap-phase[data-roadmap-phase="F5"]{--phase-color:#16765b}
.roadmap-phase[data-roadmap-phase="F6"]{--phase-color:#13798b}
.roadmap-phase[data-roadmap-phase="F7"]{--phase-color:#315db4}
.roadmap-phase[data-roadmap-phase="F8"]{--phase-color:#6849a3}
.roadmap-phase[data-roadmap-phase="F9"]{--phase-color:#9a3889}
.roadmap-phase[data-roadmap-phase="F10"]{--phase-color:#ad416c}

/* Local dependency editor: dashed edges are always unverified declarations. */
.connection-modes{display:flex;gap:7px;margin:10px 0 14px;flex-wrap:wrap}
.connections-guide{display:flex;flex-direction:column;gap:7px;padding:12px 14px;border:1px solid #6d9bb8;border-radius:9px;background:#143955;margin-bottom:12px}
.connections-guide strong{font-size:14px;color:#f0faff}.connections-guide span{font-size:12px;color:#d3e8f5;line-height:1.6}
.connection-builder{display:flex;align-items:end;gap:9px;flex-wrap:wrap;margin:12px 0}
.connection-builder label{display:flex;flex:1 1 225px;flex-direction:column;gap:6px;font-size:12px;color:#e3f2ff}
.connection-builder select{width:100%;min-width:0;background:#0c253e;color:#f4faff;border:1px solid #6696b7;border-radius:7px;padding:9px}
.connection-direction{padding:8px;color:#ffdc8c;font-size:12px;font-weight:700}
.connection-builder button{padding:9px 13px;min-height:35px}.connection-builder button:disabled{opacity:.4;cursor:not-allowed}
.draft-connection-graph{display:block;width:100%;height:auto;background:#102f48;border:1px solid #4b7998;border-radius:10px;margin:12px 0}
.draft-graph-node{cursor:pointer}.draft-graph-node:hover rect,.draft-graph-node:focus-visible rect{stroke:#ffde87;stroke-width:3px}
.connection-list{margin:16px 0}.connection-entry{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #4d7895;padding:9px 4px}
.connection-entry span{font-size:12px}.connection-entry small{display:block;font-size:10px;color:#ffdb8c;margin-top:4px}
.connection-entry button{font-size:11px}

/* Visible connections directly on the free assembly workbench. */
.workbench-link-guide{display:flex;flex-wrap:wrap;gap:7px 13px;align-items:center;background:#153d59;border:1px solid #76aac6;border-radius:9px;padding:10px 12px;margin:12px 0;font-size:12px;color:#e3f6ff}
.workbench-link-guide strong{color:#ffe28d}.workbench-link-guide span{flex:1 1 400px;line-height:1.5}.workbench-link-guide small{color:#ffdf85}
.link-mode-button{border-color:#ffdd75!important;color:#ffdd75!important;font-weight:700}
.link-mode-active{background:#ffe08b!important;color:#14253b!important}
.workbench-link-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.workbench-piece-card{z-index:1}
.workbench-piece-card.link-source{outline:3px solid #ffdf7e;border-radius:10px;box-shadow:0 0 0 5px rgba(255,223,126,.2)}
.piece-link-handle{position:absolute;bottom:7px;left:7px;width:32px;height:26px;border:1px solid #ffe092;border-radius:6px;background:#2c4a5f;color:#ffe18c;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.piece-link-handle:hover,.piece-link-handle:focus-visible{background:#9b7330;color:#fff;outline:2px solid #ffe18c}
.workbench-link-list{margin:12px 0;padding:12px;background:#10354e;border:1px solid #537c97;border-radius:9px;font-size:12px}
.workbench-link-list strong{color:#ffdf83}

/* Per-phase backbone and secondary activities: proposals only, never critical-path claims. */
.assembly-view-switch{display:flex;gap:8px;margin:11px 0;flex-wrap:wrap}.assembly-view-switch .tab.active{background:#c5e6fb;color:#10253d;border-color:#dff5ff;font-weight:800}
.spine-notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 13px;background:#103853;border:1px solid #669cba;border-radius:9px;margin:12px 0}
.spine-notice strong{font-size:12px;color:#9cdbff}.spine-notice span{font-size:12px;line-height:1.5;color:#d1e8f5;flex:1 1 380px}
.spine-scroll{overflow-x:auto;padding:8px 0 14px}
.spine-grid{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:0;min-width:840px}
.spine-stage{position:relative;min-width:0;padding:0 7px}
.spine-stage:not(:last-child) .spine-node:after{content:"";position:absolute;top:47px;left:calc(100% + 1px);width:14px;height:5px;background:#8ed0ff;z-index:1}
.spine-node{position:relative;min-height:97px;display:flex;flex-direction:column;gap:6px;padding:13px 12px;background:#15517b;border:2px solid #80c4ee;border-radius:10px}
.spine-node-index{font-size:10px;font-weight:800;color:#b9eaff}.spine-node strong{font-size:13px;color:white;line-height:1.35}.spine-node small{font-size:9px;color:#c1def1}
.spine-branch{position:relative;margin:0 10px;padding:19px 0 10px 12px;border-left:3px dashed #8fc3e3;min-height:80px}
.spine-branch-count{display:block;font-size:10px;color:#b7d6e8;margin:0 0 10px}
.spine-activity{position:relative;background:#214764;border:1px solid #91bcd5;border-radius:9px;padding:9px 9px 7px;margin-bottom:10px}
.spine-activity:before{content:"";position:absolute;top:19px;left:-15px;width:14px;border-top:2px solid #ffdb81}
.spine-activity-title{display:flex;gap:4px;align-items:flex-start;justify-content:space-between}
.spine-activity-inspect{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;flex:1;background:none;border:0;color:#e5f5ff;cursor:pointer;font-size:11px;line-height:1.4;padding:0;overflow-wrap:anywhere}
.spine-activity-inspect strong{color:#fff1a3}.spine-activity-inspect:hover{text-decoration:underline}
.spine-activity-remove{flex:0 0 24px;width:24px;height:25px;background:#a02b3b;border:1px solid #ffbdc5;border-radius:6px;color:white;font-size:17px;cursor:pointer}
.spine-activity-bottom{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:9px;flex-wrap:wrap}
.spine-activity-bottom small{font-size:9px;color:#b8d8e9}
.spine-activity-unlink{border:1px solid #90bed9;border-radius:5px;padding:3px 5px;background:#183950;color:#e6f5ff;font-size:10px;cursor:pointer}
.spine-empty{font-size:11px;color:#91b8d1;margin:0}
.spine-unassigned{margin:14px 0;border:1px solid #567e9b;border-radius:9px;padding:12px;background:#123550}
.spine-unassigned-head{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.spine-unassigned-head strong{color:#f0faff}.spine-unassigned-head span{font-size:11px;color:#c2d9e8}
.spine-unassigned-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #446b85;flex-wrap:wrap}
.spine-unassigned-title{flex:1 1 230px;text-align:left;background:transparent;border:0;color:#e5f5ff;font-size:12px;cursor:pointer}
.spine-unassigned-title strong{color:#fff0a0}
.spine-assign-label{display:flex;align-items:center;gap:7px;font-size:11px;color:#d4eaf5}
.spine-assign-label select{max-width:220px;background:#0d283e;border:1px solid #79aac8;border-radius:6px;color:white;padding:7px}
.spine-unassigned-row .action-primary{padding:7px 10px}
.spine-legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;font-size:11px;color:#c4dfef}

.spine-scenario{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#12334e;border:1px solid #6086a0;padding:10px;border-radius:9px;margin:10px 0}
.spine-scenario>div{display:flex;flex-direction:column;gap:4px;margin-right:auto}
.spine-scenario>div strong{font-size:13px}.spine-scenario>div small{color:#bcd5e8;font-size:11px}
.spine-scenario button:disabled{opacity:.45;cursor:not-allowed}
.spine-suggestion{color:#ffdf93;font-size:11px;max-width:240px;line-height:1.5}

.source-sync{display:flex;align-items:center;flex-wrap:wrap;gap:7px;background:#112d43;border:1px solid #4e7996;border-radius:9px;padding:7px 12px;margin:0 0 10px}
.source-sync>div{display:flex;flex:1 1 420px;flex-direction:column;gap:3px}
.source-sync strong{font-size:11px;color:#d8efff}.source-sync span{font-size:11px;color:#e3f4ff}
.source-sync small{font-size:10px;color:#b4cce0}
.source-sync button{font-size:11px;padding:5px 8px}

.local-idea-form{display:flex;flex-direction:column;gap:7px;margin:10px 0;padding:9px;border:1px solid #587c99;border-radius:8px}
.local-idea-form label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:#cce4f5}
.local-idea-form input,.local-idea-form select{min-width:0;width:100%;background:#0d243b;color:#fff;border:1px solid #6996b6;border-radius:6px;padding:7px}
.local-idea-form button{align-self:flex-start}
.backup-warning{padding:9px;margin:8px 0;background:#493518;border:1px solid #e0b66a;border-radius:7px;color:#fff0cf;font-size:12px}.backup-warning button{margin-left:7px}

.tray-piece-entry{display:flex;flex-direction:column;gap:3px;margin:0 0 7px}.tray-piece-entry .item{width:100%}
.tray-place-suggest{align-self:flex-start;border:1px solid #679ab8;border-radius:5px;padding:5px 7px;background:#173b55;color:#cbeaff;font-size:10px;cursor:pointer}
.tray-place-suggest:hover{background:#2a5c7a;color:white}

/* Stage selection is a visual drafting aid, not a change to official milestones. */
.spine-node{width:100%;text-align:left;cursor:pointer}
.spine-node:hover{background:#23678e;border-color:#c1e9ff}
.spine-node:focus-visible{outline:3px solid #ffe47d;outline-offset:3px}
.spine-stage-active .spine-node{border-color:#ffe47d;box-shadow:0 0 0 2px rgba(255,228,125,.35)}
.spine-stage-active .spine-branch{border-left-color:#ffe47d}
.spine-no-suggestions{margin:10px 0;padding:10px 12px;border:1px solid #8da6bd;border-radius:7px;color:#d5e8f4;font-size:12px;line-height:1.5}
.spine-phase-mismatch{font-size:11px;color:#ffda8a;line-height:1.45}
.spine-copy-help{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0;padding:10px;border:1px solid #8da6bd;border-radius:8px;font-size:12px}
.spine-route-comparison{margin:10px 0;border:1px solid #5685a2;border-radius:9px;padding:10px 12px;background:#102e49}
.spine-route-comparison summary{cursor:pointer;font-weight:750;font-size:12px;color:#dff4ff}
.spine-route-compare-stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.spine-route-compare-stats span{border:1px solid #6688a5;border-radius:6px;padding:5px 7px;font-size:11px}
.spine-route-differences{display:flex;flex-direction:column;gap:4px}
.spine-route-differences>div{display:grid;grid-template-columns:minmax(65px,.6fr) repeat(2,minmax(0,1fr));gap:8px;padding:7px 0;border-bottom:1px solid #355e7a;font-size:11px}

.spine-connection-help{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#123e59;border:1px solid #6599b6;border-radius:8px;padding:11px 13px;margin:12px 0}
.spine-connection-help>div{display:flex;flex-direction:column;gap:5px;flex:1 1 350px}.spine-connection-help strong{font-size:12px;color:#ffdf85}
.spine-connection-help span{font-size:11px;line-height:1.55;color:#d9edfa}.spine-link-count{border:1px solid #5686a3;border-radius:7px;padding:6px}
.spine-activity-links{display:flex;flex-wrap:wrap;gap:4px;padding:5px 0}.spine-activity-links small{font-size:10px;color:#a8d3e7}
.spine-dependency{font-size:10px;color:#ffe6a2;background:#3a3b35;border:1px dashed #ffce71;border-radius:5px;padding:3px 5px}
.spine-activity-connect{border:1px solid #e4b94f;background:#273f52;color:#ffe49d;border-radius:6px;font-size:10px;font-weight:700;padding:5px 7px;cursor:pointer}
.spine-activity-connect:hover,.spine-activity-connect.active{background:#70541f;color:white}.spine-link-source{outline:2px solid #ffd76c;outline-offset:2px}
.spine-connection-list{margin:15px 0;border:1px solid #537e9a;border-radius:9px;padding:12px;background:#123450}
.spine-connection-list-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:7px;border-bottom:1px solid #4e7b96;padding-bottom:9px}
.spine-connection-list-head strong{font-size:13px}.spine-connection-list-head span{font-size:11px;color:#b9d7ea}
.spine-connection-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:9px;border-bottom:1px solid #365d77;padding:9px 0}
.spine-connection-row>span{font-size:12px}.spine-connection-row small{font-size:10px;color:#ffe39c;margin-left:7px}
.spine-connection-row button{font-size:11px}

.spine-placement-audit{margin:13px 0;border:1px solid #d0a04f;background:#2c3b42;border-radius:9px;padding:10px 13px}
.spine-placement-audit summary{cursor:pointer;font-size:12px;font-weight:700;color:#ffdd99;line-height:1.5}
.spine-placement-audit>.hint{margin:9px 0}.spine-placement-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px solid #586c70}
.spine-placement-row>span{font-size:12px;flex:1 1 250px}.spine-placement-row small{display:block;color:#c6dce7;margin-top:5px;font-size:10px}
.spine-placement-row button{font-size:11px}

/* Predecessor/successor: declared dependencies only, not inferred from position. */
.spine-stage-sequence{display:flex;flex-direction:column;gap:4px;min-height:49px;padding:5px 7px 8px;color:#b9e1f6;font-size:10px;line-height:1.3;overflow-wrap:anywhere}
.spine-stage-sequence b{color:#f4e6b1}
.activity-sequence{display:grid;grid-template-columns:1fr;gap:6px;padding:7px 8px;margin:6px 0;background:#102d47;border:1px solid #4d819f;border-radius:7px;min-width:0}
.activity-sequence>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.activity-sequence strong{font-size:10px;color:#f4d68b}
.relation-items{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.relation-none{font-size:10px;color:#9ab5c7}
.relation-piece{border:1px solid #6c9cb6;background:#204e6a;color:#f2fbff;border-radius:5px;padding:3px 6px;font-size:10px;text-align:left;overflow-wrap:anywhere}
.relation-piece:hover,.relation-piece:focus-visible{background:#397696;outline:1px solid #b7e6ff}
.spine-unassigned-identity{display:flex;flex-direction:column;gap:3px;min-width:150px;flex:1 1 260px}
.spine-unassigned-identity .activity-sequence{margin:0}
.spine-activity .activity-sequence{margin-top:6px}

/* Editable proposals stay distinct from canonical evidence and roadmap. */
.location-review-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:11px 0;padding:10px 12px;border:1px solid #628fac;border-radius:8px;background:#10314c}
.location-review-toggle span{font-size:12px;color:#e0f2ff}.location-review-toggle button{background:#f0d957;color:#172438;font-weight:750}
.location-review{border:1px solid #80bbdb;background:#102c44;border-radius:10px;padding:12px;margin-bottom:14px}
.location-review-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.location-review-head strong{font-size:14px}.location-review-head .hint{max-width:730px}
.location-review-list{max-height:480px;overflow:auto;margin:10px 0;border-top:1px solid #416e8d}
.location-review-row{display:grid;grid-template-columns:minmax(220px,2fr) minmax(120px,1fr) minmax(155px,1.3fr) auto;align-items:center;gap:9px;padding:11px 4px;border-bottom:1px solid #426d8b}
.location-review-piece{display:flex;flex-direction:column;gap:5px;min-width:0}
.location-review-piece strong{font-size:12px;color:#eff9ff}.location-review-piece small{font-size:10px;color:#c2d7e6;line-height:1.4}
.location-review-row label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#d5eaff}
.location-review-row select{min-width:0;width:100%;padding:7px 5px;border:1px solid #83b4d1;background:#09253b;color:#f2faff;border-radius:6px}
.location-review-row button{padding:8px 11px}
@media(max-width:920px){.location-review-row{grid-template-columns:minmax(180px,1fr) minmax(130px,1fr)}.location-review-row button{justify-self:start}}
@media(max-width:580px){.location-review-row{grid-template-columns:1fr}}

.auto-organize-panel,.workflow-board{border:1px solid #6299b5;background:#16374e;padding:10px;border-radius:8px;margin-bottom:12px}
.auto-organize-panel strong,.workflow-board summary{font-size:12px;color:#eaf7ff}.auto-organize-panel p{font-size:11px;line-height:1.5;color:#bddbe9}.auto-organize-panel button{white-space:normal;font-size:11px}
.workflow-board summary{cursor:pointer;font-weight:700}.workflow-summary{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.workflow-summary span{padding:6px 8px;border:1px solid #5686a6;border-radius:7px;font-size:11px;background:#103049}
.workflow-picker{display:flex;flex-direction:column;gap:3px;margin:6px 0;color:#d9f0ff;font-size:10px}.workflow-picker select{width:100%;min-width:0;max-width:240px;padding:5px;background:#0b283d;border:1px solid #7aafc9;color:#fff;border-radius:5px;font-size:11px}
.workflow-stage-line{font-size:10px;color:#f4d18a;margin-top:5px}
.tray-place-suggest:disabled{opacity:.45;cursor:not-allowed;border-style:dashed}

/* Automatically derived milestone neighbors vs explicitly declared draft dependencies. */
.activity-sequence-note{display:block;color:#bcd8ea;font-size:10px;line-height:1.5;border-top:1px dashed #426b86;padding-top:5px}
.proposed-relation{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.relation-piece.proposed{border-style:dashed;border-color:#e8bd65;color:#ffe4a4;background:#594b2b}
.relation-confirm{border:1px solid #ebca6c;border-radius:5px;background:#f4db5b;color:#192a36;font-size:10px;font-weight:750;padding:4px 6px;cursor:pointer}
.relation-confirm:hover{background:#fff19a}

/* The route radar is an advisory, collapsible audit: no synthetic progress. */
.route-radar{margin:11px 0 14px;padding:11px 13px;background:#0e304b;border:1px solid #4e91b8;border-radius:10px}
.route-radar-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.route-radar-head strong{color:#e4f7ff;font-size:12px;letter-spacing:.035em}
.route-radar-head small{font-size:10px;color:#aacde2}
.route-radar-metrics,.roadmap-route-metrics{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.route-radar-metrics span,.roadmap-route-metrics span{border:1px solid #4b7593;border-radius:7px;padding:7px 9px;background:#173f5c;font-size:11px;color:#d7e9f7}
.route-radar-metrics b,.roadmap-route-metrics b{font-size:15px;color:#f2faff;margin-right:3px}
.route-radar-metrics .route-attention{border-color:#c8a448;color:#ffe7a7}
.route-radar-details{font-size:12px;border-top:1px solid #436f8b;padding-top:8px}
.route-radar-details summary,.roadmap-route-audit summary{cursor:pointer;color:#c7eaff;font-weight:700}
.route-radar-details p{line-height:1.5;margin:8px 0}

.traceability-panel{border:1px solid #6e9ab6;background:#102f49;border-radius:9px;padding:12px;margin:12px 0}

.source-history,.e3-panel{margin:7px 0 12px;padding:12px;border:1px solid #527d9a;border-radius:8px;background:#102d45}

.e3-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:5px;margin-top:10px}
.e3-results span{border:1px solid #527e9b;border-radius:5px;padding:6px;font-size:11px}

.commandbar{display:flex;flex-wrap:nowrap;align-items:center;gap:13px;min-width:0}
.command-stats{flex:0 0 auto;justify-self:auto;max-width:none}
.command-tabs{flex:1 1 auto;justify-content:flex-start;justify-self:auto;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-left:13px;border-left:1px solid #526a83}

@media(max-width:580px){.command-stats{max-width:100%;overflow-x:auto}.commandbar input{margin-left:0;max-width:100%;flex:1 1 100%}}

.arki-optimizer-row>div{display:flex;flex-direction:column;gap:5px;min-width:0}.arki-optimizer-row strong{font-size:12px}.arki-optimizer-row small{font-size:11px;color:#d0e5f4;overflow-wrap:anywhere}
.arki-optimizer-row button{flex:0 0 auto}
.arki-ideas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:18px 0}

.arki-idea>div:first-child{display:flex;flex-direction:column;gap:6px}.arki-idea strong{font-size:15px;color:#f3faff}.arki-idea small{font-size:11px;color:#9ecae8}

.arki-idea-status.approved{background:#2e9c5d;border-color:#7bebb0;color:#fff}
.arki-idea-status.pending{background:#f3d84f;border-color:#d8b825;color:#282000}
.arki-idea-status.rejected{background:#475b6c;border-color:#8399a9;color:#eef4f8}.arki-idea p{font-size:12px;line-height:1.6;margin:0;color:#dcebf6}
.arki-idea-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}.arki-idea-actions button{font-size:11px;padding:6px}

/* One-line identity. Preserve the full text; overflow horizontally only on narrow viewports. */
header .top{align-items:center;flex-wrap:nowrap;gap:14px}
.brand-line{display:flex;align-items:baseline;gap:9px;white-space:nowrap;min-width:0}

@media(max-width:1170px){header .top{overflow-x:auto}.brand-line{min-width:max-content}.brand-description{font-size:13px}header .stamp{font-size:10px;padding:5px}}
.context-help{display:flex;align-items:center;gap:10px;min-height:37px;padding:7px 12px;margin:-3px 0 11px;border:1px solid #568bad;background:#12354f;border-radius:8px;color:#e3f4ff;font-size:12px;line-height:1.4}

/* Ten-phase comparative diagnostics: counts are local warnings, never completion metrics. */
.scenario-dashboard{display:flex;flex-direction:column;gap:13px}

.scenario-alert b{color:#ffd284}

.scenario-issue-details summary{cursor:pointer;font-weight:700}
.scenario-issue{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #466e88;padding:9px 3px;font-size:12px}

/* Improvement candidates are visibly separate from live diagnostics and never imply implementation. */
.arki-ideas-summary{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.arki-ideas-summary span{padding:8px 11px;border:1px solid #5c8aaa;border-radius:8px;background:#173954;font-size:12px;color:#e1f1ff}
.arki-ideas-summary b{color:#ffe18b;font-size:16px;margin-right:4px}
.arki-idea-source{display:inline-flex;align-self:flex-start;border:1px solid #799ab0;border-radius:5px;padding:3px 6px;color:#bfe5ff;font-size:10px;font-weight:700}

.research-import{display:flex;flex-direction:column;gap:9px;padding:14px;border:1px solid #6596b6;border-radius:9px;background:#153c57;margin:13px 0}

.research-overview{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0;padding:10px;background:#123a53;border:1px solid #5c8ca8;border-radius:9px;font-size:12px}

.research-sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin:10px 0 20px}
.research-source{display:flex;flex-direction:column;gap:6px;background:#17364e;border:1px solid #4f7b98;border-radius:8px;padding:10px;font-size:11px}
.research-source small{color:#bcd8eb;overflow-wrap:anywhere}.research-source a,.arki-idea a{color:#99dfff}
.research-baseline{padding:9px;border-radius:7px;background:#42391d;color:#ffe7a5;font-weight:700;font-size:12px}

/* Additional Research tab must never overlap counters or search. */
.commandbar{grid-template-columns:auto minmax(0,1fr) minmax(125px,170px)}
.command-tabs{justify-self:stretch;justify-content:flex-start;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}

/* E3 visual alignment: identity and local state share one row; search precedes every menu. */
header .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:16px;min-width:0}
header .brand-line{display:flex;align-items:baseline;min-width:0;flex:0 1 auto;gap:9px;white-space:nowrap}

@media(max-width:1220px){.commandbar{display:flex;flex-wrap:nowrap;gap:7px}.commandbar #search{order:0;flex:0 0 150px;width:150px;max-width:150px;margin:0}.commandbar .command-tabs{order:1;flex:1 1 auto;width:auto;max-width:100%;padding:2px 0 4px 8px;border-left:1px solid #526a83}.commandbar .command-tabs .tab{padding:5px 7px;font-size:11px}.commandbar .command-tabs .tab.active,.commandbar .command-tabs .tray-menu.active{padding:4px 6px}}

/* Milestone gates report local documentary readiness only; never a green official PASS. */

.spine-gate .spine-gate-disclaimer{font-size:9px;color:#9fb9cb}

/* Dependency map shows declared edges, never inferred links. */
.spine-dependency-map{border:1px solid #5b88a4;border-radius:10px;background:#102f48;padding:12px;margin:12px 0}

/* A source-protected 10x4 navigation matrix, never a completion heatmap. */
.roadmap-milestones{border:1px solid #5e87a1;border-radius:10px;padding:12px;margin:17px 0;background:#12334c}

/* Visual-only milestone drop targets; no inferred canonical promotion. */
.spine-drag-guide{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 13px;margin:10px 0;border:1px solid #87c9e9;border-radius:8px;background:#123b55}

.spine-advisor-head>span{border:1px solid #dbb75d;color:#ffe3a0;padding:6px 9px;border-radius:7px;font-size:11px}
.spine-advisor-metrics{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}

<body>
<header><div class="top"><div class="brand-line"><h1>ARKI <span style="color:var(--accent)">MAQUETA VIVA</span></h1><span class="brand-separator" aria-hidden="true">-</span><span class="brand-description">La estructura optimizada, conexiones, piezas que faltan e Ideas de ARKI</span></div><div class="stamp" id="stamp">Cargando estado…</div></div></header>
<main id="app"><div class="panel">Cargando maqueta…</div></main>
<script type="application/json" id="arki-state">__ARKI_STATE_JSON__</script>
<script type="application/json" id="arki-assembly">__ARKI_ASSEMBLY_JSON__</script>
<script>
"use strict";
(function(){
const app=document.getElementById("app");
let state;
try{state=JSON.parse(document.getElementById("arki-state").textContent);if(!state||!Array.isArray(state.roadmap?.phases))throw Error("El Estado Estructurado no contiene roadmap.phases");}
catch(e){app.innerHTML='<div class="error">No se pudo cargar el Estado Estructurado. '+escapeHtml(String(e.message))+'</div>';document.getElementById("stamp").textContent="ERROR DE LECTURA";return;}
const labels={F1:"Identidad / Project State",F2:"Conocimiento y Universidad",F3:"Inteligencia arquitectónica",F4:"Partido y topología",F5:"Evaluación / 16→4→1",F6:"AGK / geometría 3D",F7:"Desarrollo técnico",F8:"Expediente técnico",F9:"Construcción y obra",F10:"Operación y aprendizaje"};
const descriptions={F1:"Identidad, confianza, estado y trazabilidad del proyecto.",F2:"Fuentes, curaduría, Delta 6.2, universidad, tutoría y evaluación del aprendizaje gobernado.",F3:"Razonamiento arquitectónico y decisiones D-2.",F4:"Programa, relaciones espaciales, partido y topología.",F5:"Evaluación, selección y endurecimiento semántico.",F6:"Geometría operacional gobernada por AGK; alcance congelado y acotado.",F7:"Desarrollo profesional, evidencia de origen y gemelo económico.",F8:"Documentación técnica derivada de desarrollo aceptado.",F9:"Ejecución, control de cambios, campo y gemelo digital.",F10:"Operación, mantenimiento, aprendizaje y realimentación."};
const phases=state.roadmap.phases.map(p=>({...p,name:labels[p.id]||p.id,description:descriptions[p.id]||""}));
let registry;try{registry=JSON.parse(document.getElementById("arki-assembly").textContent);if(registry.schema!=="ARKI-MAQUETA-ASSEMBLY-REGISTRY-0.1"||!Array.isArray(registry.ideas))throw Error("schema");}catch(e){app.innerHTML='<div class="error">No se pudo cargar el registro de piezas: '+String(e.message)+'</div>';return;}
const LOCAL_IDEAS_KEY="arki-maqueta-local-ideas-v1";
function validateLocalIdeas(raw){
if(!Array.isArray(raw)||raw.length>100)throw Error("Ideas locales inválidas");
const seen=new Set(),valid=new Set(state.roadmap.phases.map(x=>x.id));
return raw.map(x=>{
if(!x||typeof x!=="object"||!/^LOCAL-[1-9][0-9]{0,5}$/.test(x.id)||seen.has(x.id)||!valid.has(x.targetPhase)||typeof x.title!=="string"||x.title.trim().length<3||x.title.length>160)throw Error("Idea local inválida");
seen.add(x.id);return {id:x.id,title:x.title.trim(),targetPhase:x.targetPhase,sourceStatus:"USER_PROPOSAL_LOCAL",origin:"LOCAL_BROWSER_DRAFT"};
});
}
let localIdeas=[];try{const raw=localStorage.getItem(LOCAL_IDEAS_KEY);if(raw)localIdeas=validateLocalIdeas(JSON.parse(raw));}catch(e){localIdeas=[];}
const ideaView=x=>({...x,name:x.title,status:x.sourceStatus,description:x.origin==="LOCAL_BROWSER_DRAFT"?"Idea nueva creada en este navegador. No está incorporada al inventario canónico. Fase sugerida: "+x.targetPhase+".":"Inventario histórico: "+x.origin+". Destino propuesto: "+x.targetPhase+". NO INTEGRADO por asignación."});
const ideas=[...registry.ideas,...localIdeas].map(ideaView);
const components=(registry.components||[]).map(x=>({...x,name:x.title,status:x.sourceStatus,description:"Componente de auditoría histórica. "+x.sourceGap+". Ubicación propuesta: "+x.targetPhase+". Requiere contraste con HEAD actual."}));
const dispositions=state.f6_agk_integral_closure?.constituent_disposition||{};
const frozenPieces=[...Object.entries(dispositions).filter(([id,v])=>String(v).startsWith("FREEZE_")).map(([id,v])=>({id,name:id,status:v,description:"Componente F6 congelado en el alcance acotado registrado; no prueba integración industrial completa.",targetPhase:"F6",origin:"f6_agk_integral_closure.constituent_disposition"}))];
if(state.agk_delta_005?.status&&String(state.agk_delta_005.status).startsWith("FROZEN_")&&!frozenPieces.some(p=>p.id==="AGK-DELTA-005"))frozenPieces.push({id:"AGK-DELTA-005",name:"AGK-DELTA-005",status:state.agk_delta_005.status,targetPhase:"F6",description:"Contrato acotado congelado.",origin:"agk_delta_005.status"});
const frozenPhases=phases.filter(p=>p.status==="FROZEN").map(p=>({...p,id:p.id+"-FREEZE",name:p.name+" (fase)",targetPhase:p.id,description:"Fase congelada solo en alcance declarado."}));
const allFrozen=[...frozenPhases,...frozenPieces];
const focus=state.current_focus||{},blockers=Array.isArray(focus.blockers)?focus.blockers:[];
const extras=[
{id:"CORE",name:"ARKI Core",status:"AUTORIDAD",description:"Estado canónico y procedencia; las conexiones concretas requieren evidencia."},
{id:"D2",name:"D-2",status:"AUTORIDAD",description:"Autoridad semántica arquitectónica."},
{id:"AGK",name:"AGK",status:"AUTORIDAD",description:"Autoridad única de geometría operacional."},
{id:"ACS",name:"ACS / OECE",status:"EVIDENCIA_ACOTADA",description:"Adquisición y caracterización de evidencia externa; transferencia OECE acotada registrada PASS/E3."},
{id:"BASELINE",name:"BASELINE_0",status:"CONTRATO_DE_EVIDENCIA",description:"Línea base inmutable derivada de evidencia fuente, sin promoción canónica automática."},
{id:"S10",name:"S10",status:"PENDIENTE",description:"Respaldo SQL Server real identificado. Inventario de presupuestos y escritura nativa no demostrados."},
{id:"RVT",name:"Revit / RVT",status:"PENDIENTE",description:"Modelo real disponible; extracción semántica nativa no demostrada."}
];
const blockerParts=blockers.map(b=>({id:b,name:b,status:"BLOCKED",description:"Bloqueo explícito del Estado Estructurado. No implica que las demás piezas estén ausentes."}));
const all=[...phases,...extras,...blockerParts,...ideas,...components,...allFrozen];
let selected="F1",activePhase="F1",tab="structure",search="",assembly="5x2",tray="ideas",evolutionMode="maqueta";
const DRAFT_SCHEMA="ARKI-MAQUETA-DRAFT-1",DRAFT_KEY="arki-maqueta-assembly-draft-v1";
const movable=new Set([...ideas,...components].map(x=>x.id));
const validPhases=new Set(phases.map(x=>x.id));
function replaceLocalIdeas(next){
const validated=validateLocalIdeas(next);
for(let i=ideas.length-1;i>=0;i--)if(ideas[i].origin==="LOCAL_BROWSER_DRAFT")ideas.splice(i,1);
for(let i=all.length-1;i>=0;i--)if(all[i].origin==="LOCAL_BROWSER_DRAFT")all.splice(i,1);
for(const id of [...movable])if(id.startsWith("LOCAL-"))movable.delete(id);
localIdeas=validated;
for(const item of localIdeas){const v=ideaView(item);ideas.push(v);all.push(v);movable.add(item.id);}
}
function createLocalIdea(title,phase){
const name=String(title||"").trim();
if(name.length<3||name.length>160||!validPhases.has(phase)||localIdeas.length>=100){draftNotice="Escribe un nombre de 3 a 160 caracteres y selecciona una fase válida (máximo 100 ideas locales).";render();return;}
const nextId=1+Math.max(0,...localIdeas.map(x=>Number(x.id.slice(6))||0));
const next=[...localIdeas,{id:"LOCAL-"+nextId,title:name,targetPhase:phase}];
try{remember();replaceLocalIdeas(next);localStorage.setItem(LOCAL_IDEAS_KEY,JSON.stringify(localIdeas));autoPlace("LOCAL-"+nextId,"local");saveDraft();draftNotice="Idea LOCAL-"+nextId+" ubicada provisionalmente en "+(placements["LOCAL-"+nextId]||"BANDEJA")+(spineAssignments["LOCAL-"+nextId]===undefined?" · SIN HITO":" · Hito "+(Number(spineAssignments["LOCAL-"+nextId])+1))+". PROPUESTA REVISABLE, NO INTEGRADA.";activePhase=placements["LOCAL-"+nextId]||phase;tab="structure";spineView=true;tray="ideas";render();}
catch(e){draftNotice="No se pudo guardar la idea local: "+String(e.message);render();}
}
let sourceHistoryOpen=false,e3Open=false,e3Results=null,e3Manual={reload:false,alternative:false,refresh:false};
let unreconciledDraftBackup="",placements={},positions={},reviews={},observations={},traceNotes={},traceEvents=[],draftNotice="",storageAvailable=true,focusMode=false,connectionMode="draft",linkMode=false,linkSource="",spineView=true,spineAssignments={},alternativeSpineAssignments={},spineScenario="base",selectedSpineStage=0,workflowStages={},autoPlacementNotes={},trayCurrentPhaseOnly=true,locationReviewOpen=false,locationReviewAll=false,showAllUnassigned=false,locationFeedback=null,reviewQueueExpanded=false,technicalMode=false,decisionShowAll=false;
const SPINE_STAGES={"F1":["Propósito y alcance","Identidad y requisitos","Estado y procedencia","Gobernanza y cierre"],"F2":["Fuentes y procedencia","Curaduría y conocimiento","Universidad y tutoría","Evaluación y promoción gobernada"],"F3":["Fuentes de conocimiento","Razonamiento","Agentes y capacidades","Decisiones y trazabilidad"],"F4":["Programa arquitectónico","Relaciones espaciales","Alternativas de partido","Partido y validación"],"F5":["Criterios de evaluación","Escenarios","Comparación y trade-offs","Decisión y evidencia"],"F6":["Primitivas y representación","Topología e identidad","Operaciones geométricas","Validación y contratos"],"F7":["Sistemas y componentes","Especialidades","Coordinación","Documentación técnica"],"F8":["Documentos base","Consistencia de expediente","Revisión y conformidad","Expediente entregable"],"F9":["Planificación de obra","Ejecución","Supervisión","Control y cierre"],"F10":["Entrega y recepción","Operación","Mantenimiento","Retroalimentación"]};
const undoStack=[],redoStack=[],HISTORY_LIMIT=50;
function snapshot(){return {placements:{...placements},positions:JSON.parse(JSON.stringify(positions)),reviews:JSON.parse(JSON.stringify(reviews)),spineAssignments:{...spineAssignments},alternativeSpineAssignments:{...alternativeSpineAssignments},workflowStages:{...workflowStages},autoPlacementNotes:JSON.parse(JSON.stringify(autoPlacementNotes)),traceNotes:JSON.parse(JSON.stringify(traceNotes)),localIdeas:JSON.parse(JSON.stringify(localIdeas))};}
function remember(){undoStack.push(snapshot());if(undoStack.length>HISTORY_LIMIT)undoStack.shift();redoStack.length=0;}
function restore(snapshotValue){if(snapshotValue.localIdeas){replaceLocalIdeas(snapshotValue.localIdeas);try{localStorage.setItem(LOCAL_IDEAS_KEY,JSON.stringify(localIdeas));}catch(e){storageAvailable=false;}}placements={...snapshotValue.placements};positions=JSON.parse(JSON.stringify(snapshotValue.positions));if(snapshotValue.reviews)reviews=JSON.parse(JSON.stringify(snapshotValue.reviews));spineAssignments={...(snapshotValue.spineAssignments||{})};alternativeSpineAssignments={...(snapshotValue.alternativeSpineAssignments||{})};workflowStages={...(snapshotValue.workflowStages||{})};autoPlacementNotes=JSON.parse(JSON.stringify(snapshotValue.autoPlacementNotes||{}));traceNotes=JSON.parse(JSON.stringify(snapshotValue.traceNotes||{}));saveDraft();}
function travelHistory(direction){const from=direction==="undo"?undoStack:redoStack,to=direction==="undo"?redoStack:undoStack;if(!from.length)return;to.push(snapshot());restore(from.pop());selected=activePhase;draftNotice=direction==="undo"?"Último cambio de la maqueta deshecho.":"Cambio de la maqueta rehecho.";render();}

/* Provenance is an append-only local audit log. It is not proof of implementation.
   The log is deliberately not included in undo snapshots: reversals create new events. */
const TRACE_LIMIT=5000,TRACE_NOTE_LIMIT=300;
function traceKey(id,scenario){return id+"@"+(scenario||"base");}
function validateTraceNotes(raw){
if(raw===undefined)return {};
if(!raw||typeof raw!=="object"||Array.isArray(raw))throw Error("Metadatos de trazabilidad inválidos");
const out={};
for(const [key,v] of Object.entries(raw)){
const match=/^(.+)@(base|alternative)$/.exec(key);
if(!match||!movable.has(match[1])||!v||typeof v!=="object"||Array.isArray(v)||!["BAJA","MEDIA","ALTA_DECLARADA","DESCONOCIDA"].includes(v.confidence))throw Error("Trazabilidad inválida: "+key);
const note={};
for(const field of ["reason","source","evidence"]){if(typeof v[field]!=="string"||v[field].length>TRACE_NOTE_LIMIT)throw Error("Campo de trazabilidad inválido: "+field);note[field]=v[field];}
out[key]={...note,confidence:v.confidence};
}
return out;
}
function validateTraceEvents(raw){
if(raw===undefined)return [];
if(!Array.isArray(raw)||raw.length>TRACE_LIMIT)throw Error("Historial de decisiones inválido o excede límite; exporta antes de continuar");

/* Stage-order suggestions are derived visual hypotheses, not proven dependencies.
   The nearest populated earlier/later milestone is a candidate, not a mandatory link.
   A confirmed dependency is kept in reviews and never overwritten by the derivation. */
function proposedActivityNeighbors(id){
const phase=placements[id],index=currentSpine()[id];
if(!validPhases.has(phase)||index===undefined)return {predecessors:[],successors:[],stage:null};
const n=Number(index),map=currentSpine();
if(!Number.isInteger(n)||n<0||n>3)return {predecessors:[],successors:[],stage:null};
const staged=Object.keys(placements).filter(other=>other!==id&&placements[other]===phase&&map[other]!==undefined);
const closest=(direction)=>{
for(let k=n+direction;k>=0&&k<4;k+=direction){
const matches=staged.filter(other=>Number(map[other])===k).sort();
if(matches.length)return matches.slice(0,3);
}
return [];
};
return {predecessors:closest(-1),successors:closest(1),stage:n};
}

/* Advisory placement: no authoritative phase can be derived from a title alone.
   Historical inventory remains the baseline; only strong, unique vocabulary matches
   can propose an alternate phase, and all proposals require an explicit user action. */
function proposedLocation(piece){
const title=String(piece.name||"").toLocaleLowerCase("es").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const dictionaries={
F1:["identidad","backlog","gobernanza","rfc","procedencia","promocion humana","bitacora","registro canonico"],
F2:["ingestion","ocr","recuperacion de conocimiento","transferencia de conocimiento","tutor","universidad","formacion","normativa","jurisdiccion","regulacion","conformidad normativa"],
F3:["razonamiento","agente","inteligencia","inferencia","semantica","aprendizaje"],
F4:["partido","parti","programa arquitectonico","adyacencia","relaciones espaciales","space/room"],
F5:["evaluacion","evaluar","escenario","pareto","trade-off","criterio","simulacion"],
F6:["geometria","topologia","kernel","extrusion","primitiva","curva","parametrico"],
F7:["bim","cad","mep","estructura constructiva","desarrollo","coordinacion","constructivos","especialidades"],
F8:["expediente","memoria descriptiva","planos","entregable"],
F9:["obra","supervision","inspeccion","ejecucion"],
F10:["operacion","mantenimiento","recepcion","activo"]
};
const ranked=Object.entries(dictionaries).map(([phase,terms])=>({phase,terms:terms.filter(t=>title.includes(t)),score:terms.filter(t=>title.includes(t)).length})).sort((a,b)=>b.score-a.score);
const historic=validPhases.has(piece.targetPhase)?piece.targetPhase:null;
const best=ranked[0],runner=ranked[1];
const unique=best.score>0&&best.score>runner.score;
const strong=unique&&(best.score>=2||best.terms.some(t=>t.length>=12));
const phase=strong?best.phase:historic;
const stage=phase?suggestStage(piece,phase):null;
return {phase,stage:stage?.index??"",confidence:strong?"MEDIA":historic?"HISTÓRICA":"SIN BASE",reason:strong?"Coincidencia textual: "+best.terms.join(", "):historic?"Clasificación del inventario; sin evidencia nueva que justifique moverla.":"Sin fase sustentada; requiere clasificación manual."};
}

/* Deterministic proposals recomputed from current inventory and local graph.
   Not trained AI, not a proof of globally optimal architecture. */
function optimizedCandidates(piece){
const base=proposedLocation(piece),deps=reviews[piece.id]?.dependencies||[];
const ranked=phases.map(p=>{
const stage=suggestStage(piece,p.id);let score=0;const signals=[];
if(stage){score+=5;signals.push("actividad temática");}
if(piece.targetPhase===p.id){score+=2;signals.push("inventario histórico");}
if(base.phase===p.id&&base.confidence==="MEDIA"){score+=6;signals.push("tema distintivo");}
const upstream=deps.filter(id=>placements[id]===p.id).length;
if(upstream){score+=Math.min(8,upstream*4);signals.push(upstream+" dependencias en la fase");}
const downstream=Object.entries(reviews).filter(([id,r])=>placements[id]===p.id&&(r.dependencies||[]).includes(piece.id)).length;
if(downstream){score+=Math.min(6,downstream*3);signals.push(downstream+" dependientes en la fase");}
return {phase:p.id,stage:stage?.index??"",score,signals};
}).sort((a,b)=>b.score-a.score||a.phase.localeCompare(b.phase,undefined,{numeric:true}));
const best=ranked[0],runner=ranked[1];
return {best,ranked:ranked.slice(0,3),confidence:best.score>=9&&best.score-runner.score>=4&&best.stage!==""?"MEDIA":"BAJA"};
}

function applyLocationReview(id,phase,nodeId){
if(!movable.has(id)||!validPhases.has(phase)||!(nodeId===""||/^[0-3]$/.test(nodeId))){

}

/* Advisory-only analysis. A textual similarity is NOT a dependency, and stage order
   is not a calculated critical path. No mutations occur during diagnostics. */
function normalizedTerms(value){
const stop=new Set(["para","como","sobre","entre","desde","hasta","esta","este","estas","estos","arki","fase","hito","sistema","sistemas","modelo","modelos","capacidad","capacidades","proyecto","proyectos","local","digital","con","del","las","los","una","uno","por","que","sin","sus","and","the"]);
return new Set(String(value||"").toLocaleLowerCase("es").normalize("NFD").replace(/[\u0300-\u036f]/g,"").match(/[a-z0-9]{4,}/g)?.filter(w=>!stop.has(w))||[]);
}
function advisoryCandidates(phase){
const staged=[...ideas,...components].filter(x=>placements[x.id]===phase);
const map=currentSpine(),all=[...ideas,...components],suggestions=[],missing=[];
for(const p of staged){
const current=map[p.id],guess=suggestStage(p,phase),deps=reviews[p.id]?.dependencies||[];
if(current===undefined){
missing.push({kind:"SIN_HITO",piece:p,reason:guess?"El título coincide con "+(SPINE_STAGES[phase]?.[Number(guess.index)]||"hito")+" ("+guess.reason+").":"No hay vocabulario suficiente para inferir un hito. Se requiere clasificación humana.",stage:guess?.index??""});
}else if(guess&&current!==guess.index){
suggestions.push({kind:"CAMBIO_DE_HITO",piece:p,stage:guess.index,reason:"Actualmente Hito "+(Number(current)+1)+", candidato Hito "+(Number(guess.index)+1)+". Coincidencia textual: "+guess.reason+". No implica error del hito actual.",score:3});
}
for(const d of deps){
if(!placements[d])missing.push({kind:"DEPENDENCIA_NO_UBICADA",piece:p,reason:p.id+" necesita "+d+"; la pieza requerida no está ubicada.",target:d});
else if(placements[d]===phase&&map[p.id]!==undefined&&map[d]!==undefined&&Number(map[p.id])<Number(map[d]))
missing.push({kind:"SECUENCIA_INVERTIDA",piece:p,reason:p.id+" necesita "+d+" del Hito "+(Number(map[d])+1)+", posterior a su Hito "+(Number(map[p.id])+1)+". Revisar la secuencia propuesta.",target:d});
}
if(!reviewGate(p.id).hasEvidence)missing.push({kind:"EVIDENCIA_NO_DECLARADA",piece:p,reason:"No hay ficha completa de repositorio, archivo, SHA y prueba. No equivale a fallo de ejecución."});
}
const existing=new Set(staged.flatMap(x=>(reviews[x.id]?.dependencies||[]).map(d=>x.id+"|"+d)));
const pairCandidates=[];
for(let i=0;i<staged.length;i++)for(let j=i+1;j<staged.length;j++){
const a=staged[i],b=staged[j],aStage=map[a.id],bStage=map[b.id];
if(aStage===undefined||bStage===undefined)continue;
const at=normalizedTerms(a.name),bt=normalizedTerms(b.name);
const overlap=[...at].filter(t=>bt.has(t));
if(aStage===bStage)continue;
const distance=Math.abs(Number(aStage)-Number(bStage));
if(overlap.length<2&&distance!==1)continue;
const ordered=Number(aStage)>=Number(bStage)?{from:a,to:b}:{from:b,to:a};
if(existing.has(ordered.from.id+"|"+ordered.to.id)||existing.has(ordered.to.id+"|"+ordered.from.id))continue;
const reason=overlap.length>=2?"Coinciden los términos «"+overlap.slice(0,3).join(", ")+"» en hitos diferentes.": "Los hitos "+(Number(aStage)+1)+" y "+(Number(bStage)+1)+" son consecutivos en la ruta PROPUESTA; no hay una relación declarada entre estas actividades.";
pairCandidates.push({kind:"DEPENDENCIA_CANDIDATA",from:ordered.from,to:ordered.to,reason:reason+" Revisar si existe una dependencia real; ni la secuencia ni la similitud la demuestran.",score:overlap.length*4+(distance===1?1:0)});
}
pairCandidates.sort((a,b)=>b.score-a.score||a.from.id.localeCompare(b.from.id));

}

/* Executive decision cockpit is a presentation layer over the existing, local,
   deterministic ARKI diagnostics. No evidence promotion, code execution or

function decisionCockpit(){
const phase=phases.find(x=>x.id===activePhase)||phases[0];
const allProposals=generatedArkiIdeas();
const relevant=allProposals.filter(x=>x.phase===activePhase||x.phase==="F1–F10");
const priority=x=>x.priority==="ALTA"?0:x.category==="Diagnóstico"?1:2;
const sorted=relevant.slice().sort((a,b)=>Number(Boolean(arkiIdeaDecisions[a.id]))-Number(Boolean(arkiIdeaDecisions[b.id]))||priority(a)-priority(b)||a.id.localeCompare(b.id));
const pending=sorted.filter(x=>!arkiIdeaDecisions[x.id]),decided=sorted.length-pending.length;
const visible=decisionShowAll?sorted:pending.slice(0,3);
const globalPending=allProposals.filter(x=>!arkiIdeaDecisions[x.id]).length;
return '<div class="executive-cockpit" aria-label="Centro de decisiones de ARKI">'+
'<div class="executive-head"><div><div class="kicker">ARKI · SUPERVISIÓN HUMANA</div><h2>Decisiones y propuestas · '+escapeHtml(activePhase)+'</h2><p>'+escapeHtml(phase.name)+' · ARKI presenta candidatos; tú decides cuáles merecen evaluación y validación.</p></div><button type="button" class="tab executive-technical" data-technical-mode="on">Abrir mesa técnica →</button></div>'+
'<div class="executive-goals" aria-label="Objetivos del producto, no estados verificados">'+
'<div><b>03 · Gemelo Digital</b><span>Estado real, evidencia y sincronización</span></div>'+
'<div><b>04 · Gemelo Predictivo</b><span>Simulaciones, impactos y escenarios</span></div>'+
'<div><b>05 · ARKI Autocorrectivo</b><span>Diagnóstico, propuestas y corrección controlada</span></div></div>'+
'<p class="executive-goal-note">Estos son objetivos de evolución del producto, no capacidades acreditadas por esta maqueta.</p>'+
'<div class="executive-queue-head"><div><h3>Tu bandeja de decisiones</h3><p>Propuestas de '+escapeHtml(activePhase)+' · '+pending.length+' por decidir · '+decided+' con decisión local · '+globalPending+' pendientes en F1–F10</p></div><button type="button" class="tab" data-decision-show-all aria-expanded="'+decisionShowAll+'">'+(decisionShowAll?"Solo pendientes principales":"Ver todas ("+sorted.length+")")+'</button></div>'+
(visible.length?'<div class="executive-proposals">'+visible.map(x=>{
const status=arkiIdeaDecisions[x.id]||"PENDING";
return '<article class="executive-proposal"><div class="executive-proposal-title"><div><small>'+escapeHtml(x.id)+' · '+escapeHtml(x.category)+' · '+escapeHtml(x.source)+'</small><h4>'+escapeHtml(x.title)+'</h4></div><span class="executive-proposal-status">'+(status==="APPROVED"?"APROBADA PARA EVALUACIÓN":status==="REJECTED"?"DESCARTADA":"REQUIERE DECISIÓN")+'</span></div>'+
'<p>'+escapeHtml(x.why)+'</p>'+
'<details><summary>Ver propuesta y acción recomendada</summary><p><b>Acción:</b> '+escapeHtml(x.action)+'</p><p class="hint">Origen: '+escapeHtml(x.source)+' · Prioridad: '+escapeHtml(x.priority)+'. Diagnóstico local o catálogo editorial; no equivale a una ejecución de agentes ni a evidencia de producción.</p></details>'+
'<div class="executive-proposal-actions"><button type="button" class="executive-approve" data-arki-approve="'+escapeHtml(x.id)+'">Aprobar evaluación</button><button type="button" class="tab" data-arki-reject="'+escapeHtml(x.id)+'">Descartar</button>'+(status!=="PENDING"?'<button type="button" class="tab" data-arki-reset="'+escapeHtml(x.id)+'">Reabrir</button>':"")+'</div></article>';
}).join("")+'</div>':'<div class="executive-empty">No hay decisiones pendientes visibles en esta fase. Usa «Ver todas» para consultar las ya resueltas, o selecciona otra fase. Esto no significa que la fase esté terminada.</div>')+
'<div class="executive-next"><strong>¿Necesitas comprobar algo antes de decidir?</strong><button type="button" class="tab" data-exec-jump="roadmap">Roadmap oficial</button><button type="button" class="tab" data-exec-jump="scenarios">Comparar escenarios</button><button type="button" class="tab" data-exec-jump="arkiideas">Todas las propuestas</button><button type="button" class="tab" data-technical-mode="on">Ver vertebral y espinas</button></div>'+
'<details class="executive-advanced"><summary>Información técnica y controles de ensamblaje (ocultos por defecto)</summary><p>La mesa anterior, las conexiones, las fichas, las auditorías y los diagnósticos continúan disponibles. No se han borrado datos.</p><button type="button" class="tab" data-technical-mode="on">Entrar en mesa técnica</button></details>'+
'<p class="caption">Aprobar evaluación solo registra una decisión local. La implementación, las pruebas, la aceptación y la promoción canónica requieren un flujo posterior con evidencia y autorización.</p></div>';
}

/* Route diagnostics are recalculated from the current local draft and the read-only
   source snapshot. They do not compute project completion or validate evidence. */
function routeDiagnostics(phase,scenario){
const staged=[...ideas,...components].filter(x=>placements[x.id]===phase);
const map=scenario==="alternative"?alternativeSpineAssignments:spineAssignments;
const assigned=staged.filter(x=>Object.prototype.hasOwnProperty.call(map,x.id));
const withoutHito=staged.filter(x=>!Object.prototype.hasOwnProperty.call(map,x.id));
const noDeclaredEvidence=staged.filter(x=>!reviewGate(x.id).hasEvidence);
const lowConfidence=staged.filter(x=>autoPlacementNotes[x.id]?.confidence==="BAJA");
const unresolved=[],crossPhase=[],within=[];
for(const piece of staged){
for(const to of reviews[piece.id]?.dependencies||[]){
const edge={from:piece.id,to,fromPhase:phase,toPhase:placements[to]||""};
if(!placements[to])unresolved.push(edge);
else if(placements[to]!==phase)crossPhase.push(edge);
else within.push(edge);
}}
const available=[...ideas,...components].filter(x=>!placements[x.id]&&proposedLocation(x).phase===phase);
return {phase,staged,assigned,withoutHito,noDeclaredEvidence,lowConfidence,unresolved,crossPhase,within,available};
}

function generatedArkiIdeas(){

if(missing.length)add("DEPS-"+id,id,"Resolver dependencias sin ubicar","Hay "+missing.length+" piezas que declaran al menos una dependencia ausente de la mesa.","Verificar dependencias antes de ejecutar o promover.");
const unverified=placed.filter(x=>!reviewGate(x.id).complete);
if(unverified.length)add("QUALITY-"+id,id,"Revisar evidencia de "+unverified.length+" piezas","Las fichas locales de revisión no cumplen todas las condiciones declaradas.","Revisar evidencia, límites, dependencias y criterio de aceptación; no declarar integración.","Calidad","ALTA");

if(weak.length)add("LOW-"+id,id,"Revisar "+weak.length+" clasificaciones de baja confianza","La ubicación fue sugerida por heurística o antecedente insuficiente.","Reevaluar las diez fases y documentar la elección.");
}
const changed=sourceChanges.newIdeas.length+sourceChanges.newComponents.length+sourceChanges.newFrozen.length+sourceChanges.changedFrozen.length+sourceChanges.changedPhases.length;
if(changed)add("SOURCE-ALL","F1–F10","Revisar "+changed+" novedades de fuente","La fuente local cambió respecto de la lectura anterior, incluidas ideas, fases o FROZEN.","Contrastar novedades antes de modificar el roadmap o las decisiones.");
for(const [id,phase,category,priority,title,why,action,source] of ARKI_CONTINUOUS_IMPROVEMENTS)add(id,phase,title,why,action,category,priority,source);
return results;
}

}

/* All ten phases are compared against the same local placements and declared
   dependencies. Only spine milestones vary between reference and alternative.
   This is deterministic diagnostics, NOT a globally optimal schedule. */
function analyzeWholeScenario(scenario){
const assignments=scenario==="alternative"?alternativeSpineAssignments:spineAssignments;
const byPhase=phases.map(p=>{
const pieces=[...ideas,...components].filter(x=>placements[x.id]===p.id);
const issues=[],unlinked=pieces.filter(x=>assignments[x.id]===undefined);
for(const piece of unlinked)issues.push({kind:"SIN_HITO",severity:"REVISAR",phase:p.id,id:piece.id,description:piece.id+" aún no está vinculada a un hito en este escenario"});
for(const piece of pieces){
for(const to of reviews[piece.id]?.dependencies||[]){
const target=placements[to];
if(!target){issues.push({kind:"DEPENDENCIA_SIN_UBICAR",severity:"BLOQUEO_POTENCIAL",phase:p.id,id:piece.id,description:piece.id+" necesita "+to+" y la pieza requerida no está ubicada"});continue;}
if(target!==p.id){issues.push({kind:"ENTRE_FASES",severity:"REVISAR",phase:p.id,id:piece.id,description:piece.id+" ("+p.id+") necesita "+to+" ("+target+"); revisar secuencia transversal"});continue;}
const a=assignments[piece.id],b=assignments[to];
if(a!==undefined&&b!==undefined&&Number(a)<Number(b))issues.push({kind:"HITO_INVERTIDO",severity:"BLOQUEO_POTENCIAL",phase:p.id,id:piece.id,description:piece.id+" (hito "+(Number(a)+1)+") necesita "+to+" (hito "+(Number(b)+1)+"), posterior en la ruta propuesta"});
}
}
if(p.status==="FROZEN"&&pieces.length)issues.push({kind:"ALCANCE_FROZEN",severity:"REVISAR",phase:p.id,id:pieces[0].id,description:p.id+" tiene "+pieces.length+" piezas provisionales: comprobar si son compatibles con el alcance congelado; no se modifica FROZEN"});
const noEvidence=pieces.filter(x=>!reviewGate(x.id).hasEvidence);
const mismatch=pieces.filter(x=>x.targetPhase&&validPhases.has(x.targetPhase)&&x.targetPhase!==p.id);
return {phase:p.id,pieces:pieces.length,linked:pieces.length-unlinked.length,unlinked:unlinked.length,noEvidence:noEvidence.length,mismatch:mismatch.length,issues};
});
const issues=byPhase.flatMap(p=>p.issues);
return {scenario,byPhase,issues,placed:byPhase.reduce((n,p)=>n+p.pieces,0),linked:byPhase.reduce((n,p)=>n+p.linked,0),potential:issues.filter(x=>x.severity==="BLOQUEO_POTENCIAL").length,review:issues.filter(x=>x.severity==="REVISAR").length,missingEvidence:byPhase.reduce((n,p)=>n+p.noEvidence,0),mismatch:byPhase.reduce((n,p)=>n+p.mismatch,0)};
}

function addConnection(from,to){
if(!Object.prototype.hasOwnProperty.call(placements,from)||!Object.prototype.hasOwnProperty.call(placements,to)){draftNotice="Ambas piezas deben estar colocadas en la maqueta.";return;}
if(from===to){draftNotice="Una pieza no puede depender de sí misma.";return;}
const existing=reviews[from]||{},deps=existing.dependencies||[];
if(deps.includes(to)){draftNotice="La conexión "+from+" → "+to+" ya está declarada.";return;}
try{const next=validateReviews({...reviews,[from]:{...existing,dependencies:[...deps,to]}});remember();reviews=next;saveDraft();draftNotice="Conexión "+from+" necesita "+to+" guardada como HIPÓTESIS LOCAL, NO VERIFICADA.";}
catch(e){draftNotice="Conexión rechazada: "+String(e.message);}
}
function removeConnection(from,to){
const r=reviews[from];if(!r||!Array.isArray(r.dependencies)||!r.dependencies.includes(to))return;
try{const next=validateReviews({...reviews,[from]:{...r,dependencies:r.dependencies.filter(d=>d!==to)}});remember();reviews=next;saveDraft();draftNotice="Conexión local "+from+" → "+to+" retirada.";}

let correctiveCases=[],correctiveSelected="",correctiveNotice="";
function validateCorrectiveCases(raw){
if(!Array.isArray(raw)||raw.length>30)throw Error("Registro autocorrectivo inválido");
const allowed=new Set(["PROPOSED","IMPACT_REVIEWED","AUTHORIZED","EXTERNAL_EXECUTION_PENDING","EVIDENCE_UNVERIFIED","REVERSAL_REQUESTED"]);
const seen=new Set();
return raw.map(c=>{
if(!c||typeof c!=="object"||!/^AC-[0-9]{1,5}$/.test(c.id)||seen.has(c.id)||!validPhases.has(c.phase)||typeof c.title!=="string"||c.title.length<5||c.title.length>180||typeof c.rationale!=="string"||c.rationale.length<10||c.rationale.length>1500||!allowed.has(c.status))throw Error("Caso autocorrectivo inválido");
seen.add(c.id);
const impact=c.impact&&typeof c.impact==="object"?c.impact:null;
const receipt=typeof c.receipt==="string"?c.receipt.slice(0,500):"";
return {id:c.id,phase:c.phase,title:c.title,rationale:c.rationale,status:c.status,impact,receipt,created:typeof c.created==="string"?c.created.slice(0,40):"",source:typeof c.source==="string"?c.source.slice(0,100):"MANUAL"};
});
}
try{const raw=localStorage.getItem(CORRECTIVE_KEY);if(raw)correctiveCases=validateCorrectiveCases(JSON.parse(raw));}catch(e){correctiveCases=[];correctiveNotice="No se pudo recuperar el registro autocorrectivo local. Exporta tus respaldos antes de modificarlo.";}
function persistCorrective(){try{localStorage.setItem(CORRECTIVE_KEY,JSON.stringify(correctiveCases));return true;}catch(e){correctiveNotice="No se guardó el caso en el navegador. La persistencia NO está confirmada.";return false;}}
function correctiveCase(){return correctiveCases.find(x=>x.id===correctiveSelected)||correctiveCases[0]||null;}
function createCorrective(title,phase,rationale,source){
title=String(title||"").trim();rationale=String(rationale||"").trim();
if(title.length<5||title.length>180||rationale.length<10||rationale.length>1500||!validPhases.has(phase)||correctiveCases.length>=30){correctiveNotice="Completa título (5–180), fundamento (10–1500) y fase válida; máximo 30 casos.";render();return;}
const id="AC-"+(1+Math.max(0,...correctiveCases.map(x=>Number(x.id.slice(3))||0)));

}
