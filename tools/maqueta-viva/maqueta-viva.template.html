app.querySelectorAll("[data-route-piece]").forEach(el=>{const activate=()=>{
const id=el.dataset.routePiece;if(!movable.has(id))return;
if(placements[id]&&validPhases.has(placements[id])){activePhase=placements[id];tab="structure";spineView=true;selected=id;locationReviewOpen=false;draftNotice="Inspecciona "+id+" en "+activePhase+". La relación y la ubicación son locales, no verificadas.";}
else{tab="structure";spineView=true;locationReviewOpen=true;locationReviewAll=true;selected=activePhase;draftNotice="La pieza "+id+" no está ubicada. Abre «Revisar ubicaciones sugeridas» para asignarla manualmente.";}
render();
};el.addEventListener("click",activate);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();activate();}});});
app.querySelectorAll("[data-relation-jump]").forEach(el=>el.addEventListener("click",()=>{const id=el.dataset.relationJump;if(!movable.has(id))return;const destination=placements[id];if(destination&&validPhases.has(destination)){activePhase=destination;spineView=true;tab="structure";selected=id;draftNotice="Relación local: "+id+" en "+destination+". Revisa su ficha y evidencia.";render();}else{draftNotice="La pieza "+id+" está declarada como relación, pero no está ubicada en ninguna fase. Busca su ID en la bandeja.";selected=activePhase;render();}}));
app.querySelectorAll("[data-phase]").forEach(el=>el.addEventListener("click",()=>{evolutionMode="maqueta";decisionShowAll=false;spineView=true;selectedSpineStage=0;activePhase=el.dataset.phase;selected=activePhase;linkSource="";tab="structure";render();}));
app.querySelectorAll("[data-roadmap-phase]").forEach(el=>el.addEventListener("click",()=>{evolutionMode="maqueta";technicalMode=false;decisionShowAll=false;spineView=true;selectedSpineStage=0;activePhase=el.dataset.roadmapPhase;selected=activePhase;tab="structure";render();}));
app.querySelectorAll("[data-roadmap-stage]").forEach(el=>el.addEventListener("click",()=>{technicalMode=true;const [phase,index]=el.dataset.roadmapStage.split(":");if(!validPhases.has(phase)||!/^[0-3]$/.test(index))return;activePhase=phase;selectedSpineStage=Number(index);spineScenario="base";spineView=true;selected=activePhase;tab="structure";draftNotice="Hito "+(selectedSpineStage+1)+" de "+phase+" abierto desde la matriz de referencia; ninguna autoridad canónica ha cambiado.";render();}));
app.querySelectorAll("[data-assembly]").forEach(el=>el.addEventListener("click",()=>{assembly=el.dataset.assembly;render();}));
app.querySelectorAll("[data-focus-mode]").forEach(el=>el.addEventListener("click",()=>{focusMode=!focusMode;selected=activePhase;render();}));
app.querySelectorAll("[data-reset-layout]").forEach(el=>el.addEventListener("click",()=>{const ids=Object.keys(positions).filter(id=>placements[id]===activePhase);if(!ids.length)return;remember();ids.forEach(id=>delete positions[id]);saveDraft();draftNotice="Piezas de "+activePhase+" reorganizadas automáticamente en la mesa.";render();}));
app.querySelectorAll("[data-undo]").forEach(el=>el.addEventListener("click",()=>travelHistory("undo")));
app.querySelectorAll("[data-redo]").forEach(el=>el.addEventListener("click",()=>travelHistory("redo")));
app.querySelectorAll("[data-close-inspector]").forEach(el=>el.addEventListener("click",()=>{selected=activePhase;render();}));
app.querySelectorAll("[data-tray]").forEach(el=>el.addEventListener("click",()=>{technicalMode=true;tray=el.dataset.tray;tab="structure";selected=activePhase;render();}));
app.querySelectorAll("[data-inspect]").forEach(el=>el.addEventListener("click",()=>{selected=el.dataset.inspect;render();}));
app.querySelectorAll("[data-drag-piece]").forEach(el=>el.addEventListener("dragstart",e=>{const id=el.dataset.dragPiece;if(!movable.has(id)||Object.prototype.hasOwnProperty.call(placements,id)){e.preventDefault();return;}e.dataTransfer.setData("text/plain",id);e.dataTransfer.effectAllowed="move";}));
const dropZone=app.querySelector("#arki-workspace");
if(dropZone&&tab==="structure"){
dropZone.setAttribute("aria-label","Mesa de trabajo azul de ARKI: puedes soltar aquí una pieza de la bandeja derecha");
dropZone.addEventListener("dragover",e=>{if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes("text/plain")){e.preventDefault();dropZone.classList.add("drag-over");e.dataTransfer.dropEffect="move";}});
dropZone.addEventListener("dragleave",e=>{if(!dropZone.contains(e.relatedTarget))dropZone.classList.remove("drag-over");});
dropZone.addEventListener("drop",e=>{e.preventDefault();dropZone.classList.remove("drag-over");const id=e.dataTransfer.getData("text/plain");if(movable.has(id)&&!Object.prototype.hasOwnProperty.call(placements,id)){stagePiece(id,activePhase);selected=id;render();}});
}
app.querySelectorAll("[data-stage]").forEach(el=>el.addEventListener("click",()=>{const picker=app.querySelector("#placement-phase");const target=picker?picker.value:activePhase;stagePiece(el.dataset.stage,target);activePhase=target;render();}));
app.querySelectorAll("[data-unstage]").forEach(el=>el.addEventListener("click",()=>{const id=el.dataset.unstage;unstagePiece(id);selected=activePhase;if(ideas.some(x=>x.id===id))tray="ideas";else if(components.some(x=>x.id===id))tray="components";tab="structure";render();}));
app.querySelectorAll("[data-review]").forEach(el=>el.addEventListener("click",()=>{
const get=id=>app.querySelector(id)?.value||"";
recordReview(el.dataset.review,{repo:get("#review-repo"),file:get("#review-file"),sha:get("#review-sha"),test:get("#review-test"),dependencies:get("#review-deps")});render();
}));
app.querySelectorAll("[data-export]").forEach(el=>el.addEventListener("click",()=>{draftFile();render();}));
app.querySelectorAll("[data-export-backup]").forEach(el=>el.addEventListener("click",()=>{exportUnreconciledBackup();render();}));
const importControl=app.querySelector("#draft-import");if(importControl)importControl.addEventListener("change",e=>importDraft(e.target.files&&e.target.files[0]));
const observationControl=app.querySelector("#observation-import");if(observationControl)observationControl.addEventListener("change",e=>importObservation(e.target.files&&e.target.files[0]));
app.querySelectorAll("[data-select]").forEach(el=>{const fn=()=>{technicalMode=true;selected=el.dataset.select;if(/^F\d+$/.test(selected)){activePhase=selected;tab="structure";}else{tab="structure";}render();};el.addEventListener("click",fn);if(el.tagName.toLowerCase()==="g")el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn();}});});
layoutCanvas();
app.querySelectorAll("[data-move-piece]").forEach(el=>{
let origin=null,card=null,canvas=null;
el.addEventListener("pointerdown",e=>{
if(e.button!==0)return;
canvas=app.querySelector("#piece-canvas");card=el.closest(".workbench-piece-card");
if(!canvas||!card)return;
e.preventDefault();origin={x:e.clientX,y:e.clientY,left:card.offsetLeft,top:card.offsetTop,moved:false};
el.setPointerCapture(e.pointerId);card.classList.add("piece-moving");
});
el.addEventListener("pointermove",e=>{
if(!origin||!card||!canvas)return;
const dx=e.clientX-origin.x,dy=e.clientY-origin.y;
if(Math.abs(dx)+Math.abs(dy)>3)origin.moved=true;
if(!origin.moved)return;
const maxX=Math.max(0,canvas.clientWidth-card.offsetWidth),maxY=Math.max(0,canvas.clientHeight-card.offsetHeight);
card.style.left=Math.max(0,Math.min(maxX,origin.left+dx))+"px";
card.style.top=Math.max(0,Math.min(maxY,origin.top+dy))+"px";updateWorkbenchConnections();
});
const finish=e=>{
if(!origin||!card||!canvas)return;
card.classList.remove("piece-moving");
if(origin.moved){
const maxX=Math.max(1,canvas.clientWidth-card.offsetWidth),maxY=Math.max(1,canvas.clientHeight-card.offsetHeight);
const p={x:Math.max(0,Math.min(1,card.offsetLeft/maxX)),y:Math.max(0,Math.min(1,card.offsetTop/maxY))};
const id=el.dataset.movePiece;remember();positions[id]=p;saveDraft();draftNotice="Posición de "+id+" guardada en la mesa de "+activePhase+" (borrador).";
}
origin=null;
};
el.addEventListener("pointerup",finish);el.addEventListener("pointercancel",finish);
});
app.querySelector("#search").addEventListener("input",e=>{const pos=e.target.selectionStart;search=e.target.value;render();const inp=app.querySelector("#search");inp.focus();inp.setSelectionRange(pos,pos);});

}
/* Delegated contextual guide: survives render() replacements and works with
   mouse, pen, keyboard focus and dynamically created local ideas. */
const HELP_DEFAULT="Pasa el cursor o utiliza Tab sobre un botón, hito o pieza para ver su función. Los cambios de la maqueta son borradores locales.";
const HELP_TABS={
structure:"Estructura: abre la fase seleccionada. Vista Vertebral por defecto y Mesa Libre como alternativa; ninguna modifica el roadmap oficial.",
connections:"Conexiones: declara o inspecciona dependencias entre piezas. Las flechas son hipótesis locales, no integraciones verificadas.",
roadmap:"Roadmap: consulta F1–F10, estados oficiales y evidencia del Estado Estructurado. Las cantidades de piezas son solo borradores.",
scenarios:"Escenarios: compara las diez fases entre Referencia y Alternativa A; identifica posibles bloqueos, diferencias y alertas sin declarar una solución óptima.",
parts:"Inventario: explora las piezas registradas y sus datos de procedencia; presencia en inventario no implica integración.",
floating:"Flotantes: consulta elementos pendientes de ubicación o relación; su clasificación requiere revisión.",
arkiideas:"Ideas ARKI: muestra propuestas heurísticas recalculadas con el borrador; aprobar evaluación no implementa código.",
digital:"Gemelo Digital: lectura local del estado, procedencia y novedades; no hay sincronización remota verificada.",
autocorrective:"ARKI Autocorrectivo: propuestas, evaluación heurística, autorización y órdenes exportables; sin ejecución remota ni aceptación automática."
};
const HELP_TRAYS={
pending:"Pendientes: muestra bloqueos y reconciliaciones explícitos de las fuentes locales; no significa que todo esté sin implementar.",
ideas:"Ideas: abre la bandeja de ideas históricas y propuestas locales. Arrastra una a la mesa para ubicarla provisionalmente.",
components:"Dispersas: piezas detectadas en inventarios históricos; requieren verificación de implementación e integración.",
frozen:"FROZEN: consulta registros congelados de la fuente canónica; una pieza visual no modifica ni descongela un contrato."
};
function contextualDescription(el){
if(!el)return HELP_DEFAULT;
const d=el.dataset||{};
if(d.help)return d.help;
if(d.phase){const p=phases.find(x=>x.id===d.phase);return p?d.phase+" · "+p.name+": "+p.description+" Estado oficial: "+p.status+". Pulsa para abrir su columna vertebral.":HELP_DEFAULT;}
if(d.tab)return HELP_TABS[d.tab]||"Abrir sección "+d.tab+".";
if(d.tray)return HELP_TRAYS[d.tray]||"Cambiar categoría de la bandeja.";
if(d.roadmapPhase)return "Abrir "+d.roadmapPhase+" desde el roadmap oficial en modo de ensamblaje local.";
if(d.scenarioPhase)return "Abrir "+d.scenarioPhase+" y revisar sus espinas y dependencias declaradas.";
if(d.scenarioJump)return "Revisar "+d.scenarioJump+" en "+(d.scenarioKind==="alternative"?"Alternativa A":"Referencia propuesta")+". La alerta no es un fallo verificado.";
if(d.spinePick!==undefined)return "Seleccionar hito "+(Number(d.spinePick)+1)+" de la columna vertebral propuesta. No cambia el roadmap canónico.";
if(d.spineAssign)return "Vincular "+d.spineAssign+" al hito elegido como hipótesis local; no certifica integración.";
if(d.spineUnlink)return "Desvincular "+d.spineUnlink+" de su hito en el escenario actual sin retirar la pieza de la fase.";
if(d.spineScenario)return d.spineScenario==="base"?"Referencia propuesta: vinculaciones de espinas del escenario de referencia.":"Alternativa A: modifica hitos de espinas independientemente de la referencia.";
if(d.spineConnect||d.connectPiece)return "Conectar esta actividad con otra: primero elige la que depende, luego la pieza necesaria. Relación no verificada.";
if(d.linkMode!==undefined)return "Activar o finalizar el modo de conexión entre actividades. Las flechas quedan en el borrador local.";
if(d.unstage)return "Retirar "+d.unstage+" de la mesa y devolverla a su bandeja. No borra el inventario canónico.";
if(d.movePiece)return "Arrastrar "+d.movePiece+" por la mesa libre. La posición se conserva localmente.";
if(d.dragPiece)return "Pieza "+d.dragPiece+": arrastra a la fase o utiliza el botón de ubicación. No se integra por colocarla.";
if(d.stage)return "Ubicar "+d.stage+" en la fase elegida como borrador reversible.";
if(d.sourceOpen)return d.sourceOpen==="roadmap"?"Ver cambios en el roadmap canónico local.":"Ver novedades FROZEN de las fuentes locales.";
if(d.sourceHistory!==undefined)return "Historial de cambios detectados entre lecturas locales; no consulta GitHub automáticamente.";
if(d.export!==undefined)return "Exportar el borrador JSON para respaldo o traslado. No publica ni modifica ARKI.";
if(d.undo!==undefined)return "Deshacer el último cambio reversible del borrador durante esta sesión.";
if(d.redo!==undefined)return "Rehacer el último cambio deshecho durante esta sesión.";
if(d.focusMode!==undefined)return "Ampliar o restaurar la mesa ocultando temporalmente la bandeja, sin perder piezas.";
if(d.resetLayout!==undefined)return "Ordenar posiciones libres de la fase; la operación puede deshacerse.";
if(d.arkiApprove)return "Autorizar la evaluación de la idea "+d.arkiApprove+"; no ejecutar ni integrar automáticamente.";
if(d.arkiReject)return "Descartar provisionalmente la idea "+d.arkiReject+" en este navegador.";
if(d.addLocalIdea!==undefined)return "Añadir una nueva idea local a la bandeja; requiere exportar JSON para compartirla.";
if(d.e3Run!==undefined)return "Ejecutar comprobaciones locales del navegador; no sustituyen la verificación visual E3.";
if(d.linkAdd!==undefined)return "Crear una dependencia declarada entre dos piezas ubicadas, sujeta a validación.";
if(d.linkRemove)return "Quitar la dependencia local de "+d.linkRemove+" con "+(d.linkTarget||"otra pieza")+".";
if(el.matches?.(".spine-stage"))return "Hito de la columna vertebral propuesta: reúne espinas vinculadas y candidatos. La secuencia no es una ruta crítica calculada.";
if(el.matches?.(".spine-branch"))return "Espinas del hito: actividades vinculadas a este nodo en el escenario local actual, no certificadas.";
if(el.matches?.(".spine-unassigned-row, .spine-unassigned"))return "Espinas pendientes: elige un hito o acepta una sugerencia explícitamente; no se vinculan solas.";
if(el.matches?.(".spine-preview-group, .spine-preview-card"))return "Candidatos de espina por coincidencia temática; revisa antes de aceptar. No son dependencias verificadas.";
if(el.matches?.(".spine-scenario"))return "Escenarios: Referencia propuesta y Alternativa A guardan hitos distintos. El roadmap oficial no cambia.";
if(el.matches?.(".spine-progress-panel"))return "Cobertura de vinculaciones del borrador visual, no porcentaje de avance oficial.";
if(el.matches?.(".spine-notice"))return "Ruta estructural propuesta: no es ruta crítica calculada ni prueba de integración.";
if(el.matches?.(".route-radar, .roadmap-route-audit"))return "Radar de dependencias, piezas sin hito y alertas entre fases; recalculado localmente, sin modificar el roadmap.";
if(el.matches?.(".arki-optimizer-row"))return "Sugerencia heurística de fase e hito, basada en texto, inventario y dependencias. Requiere validación.";
if(el.matches?.(".connection-entry"))return "Dependencia declarada en el borrador; comprueba dirección y evidencia antes de utilizarla.";
if(el.matches?.(".tray-piece"))return "Pieza disponible en la bandeja: puedes ubicarla provisionalmente o inspeccionar su procedencia.";
if(el.matches?.(".spine-placement-row"))return "La fase colocada difiere de la clasificación histórica. Revisar antes de trasladar.";

if(el.matches?.(".workbench-piece-card"))return "Pieza colocada como borrador: puedes inspeccionarla, moverla, conectarla o devolverla con X.";
if(el.matches?.(".scenario-metric"))return "Indicador calculado del borrador de escenario; no mide el avance oficial ni demuestra optimalidad.";
if(el.matches?.(".scenario-issue"))return "Posible conflicto o revisión deducida de las declaraciones actuales. Abre la pieza para comprobar su causa.";
if(el.matches?.(".roadmap-phase"))return "Tarjeta de fase: estado oficial del Estado Estructurado y recuento separado de piezas provisionales.";
if(el.matches?.(".arki-idea"))return "Idea heurística para evaluación humana; su aprobación no produce implementación automática.";
if(el.matches?.(".source-sync"))return "Fuentes locales: novedades detectadas al regenerar la maqueta. Sin sincronización remota automática.";
if(el.matches?.(".command-stat"))return (el.getAttribute("title")||"Contador de fases")+". Proviene del estado oficial, no de piezas colocadas.";
if(el.matches?.("select"))return (el.getAttribute("aria-label")||"Selector")+" · elige una opción y confirma con el botón correspondiente.";
if(el.matches?.("input, textarea"))return (el.getAttribute("aria-label")||el.getAttribute("placeholder")||"Campo de entrada")+" · modifica solo datos de esta sesión o del borrador.";
const explicit=el.getAttribute?.("title")||el.getAttribute?.("aria-label");
if(explicit)return explicit;
const label=(el.innerText||el.textContent||"").trim().replace(/\s+/g," ").slice(0,100);
if(el.matches?.("button, summary, [role='button']"))return "Acción «"+(label||"Abrir")+"»: consulta o modifica la vista o el borrador local. Verifica el resultado antes de asumir cambios oficiales.";
if(el.matches?.(".panel"))return "Panel de ARKI Maqueta Viva: lectura y ensamblaje local, sin modificación del roadmap oficial.";
return HELP_DEFAULT;
}
function helpTarget(target){
if(!target||typeof target.closest!=="function")return null;
return target.closest("button, a, summary, select, input, textarea, [role='button'], [data-help], .spine-stage, .spine-unassigned-row, .workbench-piece-card, .roadmap-phase, .arki-idea, .source-sync, .scenario-metric, .scenario-issue, .command-stat, .spine-branch, .spine-unassigned-row, .spine-unassigned, .spine-preview-group, .spine-preview-card, .spine-scenario, .spine-progress-panel, .spine-notice, .route-radar, .roadmap-route-audit, .arki-optimizer-row, .connection-entry, .tray-piece, .spine-placement-row, .panel");
}
function updateContextHelp(target){
const output=app.querySelector("#arki-context-text");
if(output)output.textContent=contextualDescription(helpTarget(target));
}
app.addEventListener("mouseover",e=>updateContextHelp(e.target));
app.addEventListener("focusin",e=>updateContextHelp(e.target));
app.addEventListener("mouseout",e=>{if(!app.contains(e.relatedTarget))updateContextHelp(null);else updateContextHelp(e.relatedTarget);});
app.addEventListener("focusout",e=>{if(!app.contains(e.relatedTarget))updateContextHelp(null);});
render();
})();
</script>
</body>
</html>
