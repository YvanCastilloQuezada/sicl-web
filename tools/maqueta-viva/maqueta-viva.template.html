.commandbar input{justify-self:end;min-width:125px;width:clamp(125px,13vw,200px);max-width:100%;padding:6px 9px;font-size:12px;border-radius:6px}

<body>
<header><div class="top"><div><h1>ARKI <span style="color:var(--accent)">MAQUETA VIVA</span></h1><div class="sub">La estructura, sus conexiones y las piezas que faltan · lectura local sin modificar ARKI</div></div><div class="stamp" id="stamp">Cargando estado…</div></div></header>
<main id="app"><div class="panel">Cargando maqueta…</div></main>
<script type="application/json" id="arki-state">__ARKI_STATE_JSON__</script>
<script type="application/json" id="arki-assembly">__ARKI_ASSEMBLY_JSON__</script>
<script>
"use strict";
(function(){
const app=document.getElementById("app");
let state;
try{state=JSON.parse(document.getElementById("arki-state").textContent);if(!state||!Array.isArray(state.roadmap?.phases))throw Error("El Estado Estructurado no contiene roadmap.phases");}
catch(e){app.innerHTML='<div class="error">No se pudo cargar el Estado Estructurado. '+escapeHtml(String(e.message))+'</div>';document.getElementById("stamp").textContent="ERROR DE LECTURA";return;}
const labels={F1:"Identidad / Project State",F2:"Conocimiento y normas",F3:"Inteligencia arquitectónica",F4:"Partido y topología",F5:"Evaluación / 16→4→1",F6:"AGK / geometría 3D",F7:"Desarrollo técnico",F8:"Expediente técnico",F9:"Construcción y obra",F10:"Operación y aprendizaje"};
const descriptions={F1:"Identidad, confianza, estado y trazabilidad del proyecto.",F2:"Biblioteca de conocimiento, normativa y procedencia.",F3:"Razonamiento arquitectónico y decisiones D-2.",F4:"Programa, relaciones espaciales, partido y topología.",F5:"Evaluación, selección y endurecimiento semántico.",F6:"Geometría operacional gobernada por AGK; alcance congelado y acotado.",F7:"Desarrollo profesional, evidencia de origen y gemelo económico.",F8:"Documentación técnica derivada de desarrollo aceptado.",F9:"Ejecución, control de cambios, campo y gemelo digital.",F10:"Operación, mantenimiento, aprendizaje y realimentación."};
const phases=state.roadmap.phases.map(p=>({...p,name:labels[p.id]||p.id,description:descriptions[p.id]||""}));
let registry;try{registry=JSON.parse(document.getElementById("arki-assembly").textContent);if(registry.schema!=="ARKI-MAQUETA-ASSEMBLY-REGISTRY-0.1"||!Array.isArray(registry.ideas))throw Error("schema");}catch(e){app.innerHTML='<div class="error">No se pudo cargar el registro de piezas: '+String(e.message)+'</div>';return;}
const ideas=registry.ideas.map(x=>({...x,name:x.title,status:x.sourceStatus,description:"Inventario histórico: "+x.origin+". Destino propuesto: "+x.targetPhase+". NO INTEGRADO por asignación."}));
const components=(registry.components||[]).map(x=>({...x,name:x.title,status:x.sourceStatus,description:"Componente de auditoría histórica. "+x.sourceGap+". Ubicación propuesta: "+x.targetPhase+". Requiere contraste con HEAD actual."}));
const dispositions=state.f6_agk_integral_closure?.constituent_disposition||{};
const frozenPieces=[...Object.entries(dispositions).filter(([id,v])=>String(v).startsWith("FREEZE_")).map(([id,v])=>({id,name:id,status:v,description:"Componente F6 congelado en el alcance acotado registrado; no prueba integración industrial completa.",targetPhase:"F6",origin:"f6_agk_integral_closure.constituent_disposition"}))];
if(state.agk_delta_005?.status&&String(state.agk_delta_005.status).startsWith("FROZEN_")&&!frozenPieces.some(p=>p.id==="AGK-DELTA-005"))frozenPieces.push({id:"AGK-DELTA-005",name:"AGK-DELTA-005",status:state.agk_delta_005.status,targetPhase:"F6",description:"Contrato acotado congelado.",origin:"agk_delta_005.status"});
const frozenPhases=phases.filter(p=>p.status==="FROZEN").map(p=>({...p,id:p.id+"-FREEZE",name:p.name+" (fase)",targetPhase:p.id,description:"Fase congelada solo en alcance declarado."}));
const allFrozen=[...frozenPhases,...frozenPieces];
const focus=state.current_focus||{},blockers=Array.isArray(focus.blockers)?focus.blockers:[];
const extras=[
{id:"CORE",name:"ARKI Core",status:"AUTORIDAD",description:"Estado canónico y procedencia; las conexiones concretas requieren evidencia."},
{id:"D2",name:"D-2",status:"AUTORIDAD",description:"Autoridad semántica arquitectónica."},
{id:"AGK",name:"AGK",status:"AUTORIDAD",description:"Autoridad única de geometría operacional."},
{id:"ACS",name:"ACS / OECE",status:"EVIDENCIA_ACOTADA",description:"Adquisición y caracterización de evidencia externa; transferencia OECE acotada registrada PASS/E3."},
{id:"BASELINE",name:"BASELINE_0",status:"CONTRATO_DE_EVIDENCIA",description:"Línea base inmutable derivada de evidencia fuente, sin promoción canónica automática."},
{id:"S10",name:"S10",status:"PENDIENTE",description:"Respaldo SQL Server real identificado. Inventario de presupuestos y escritura nativa no demostrados."},
{id:"RVT",name:"Revit / RVT",status:"PENDIENTE",description:"Modelo real disponible; extracción semántica nativa no demostrada."}
];
const blockerParts=blockers.map(b=>({id:b,name:b,status:"BLOCKED",description:"Bloqueo explícito del Estado Estructurado. No implica que las demás piezas estén ausentes."}));
const all=[...phases,...extras,...blockerParts,...ideas,...components,...allFrozen];
let selected="F1",activePhase="F1",tab="structure",search="",assembly="5x2",tray="pending";
const DRAFT_SCHEMA="ARKI-MAQUETA-DRAFT-1",DRAFT_KEY="arki-maqueta-assembly-draft-v1";
const movable=new Set([...ideas,...components].map(x=>x.id));
const validPhases=new Set(phases.map(x=>x.id));
let placements={},reviews={},draftNotice="",storageAvailable=true;
function validateDraft(raw){
if(!raw||raw.schema!==DRAFT_SCHEMA||!raw.placements||typeof raw.placements!=="object"||Array.isArray(raw.placements))throw Error("Formato de borrador inválido");
const cleaned={};
for(const [id,phase] of Object.entries(raw.placements)){
if(!movable.has(id)||!validPhases.has(phase))throw Error("Pieza o fase no reconocida: "+id);
cleaned[id]=phase;
}
return cleaned;
}
function validateReviews(raw){
if(raw===undefined)return {};
if(!raw||typeof raw!=="object"||Array.isArray(raw))throw Error("Revisiones inválidas");
const clean={};
for(const [id,value] of Object.entries(raw)){
if(!movable.has(id)||!value||typeof value!=="object"||Array.isArray(value))throw Error("Revisión de pieza no reconocida: "+id);
const repo=String(value.repo||""),file=String(value.file||""),sha=String(value.sha||""),test=String(value.test||"");
const deps=value.dependencies===undefined?[]:value.dependencies;
if(!Array.isArray(deps)||deps.length>30||deps.some(d=>typeof d!=="string"||!movable.has(d)||d===id)||new Set(deps).size!==deps.length)throw Error("Dependencias inválidas: "+id);
if(repo.length>160||file.length>260||sha.length>40||test.length>300||!/^([a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+)?$/.test(repo)||!/^([a-fA-F0-9]{40})?$/.test(sha))throw Error("Referencia de evidencia inválida: "+id);
clean[id]={repo,file,sha,test,dependencies:[...deps]};
}
const visit=(id,stack,done)=>{
if(stack.has(id))throw Error("Dependencia circular detectada: "+id);
if(done.has(id))return;
stack.add(id);for(const dep of clean[id]?.dependencies||[])visit(dep,stack,done);stack.delete(id);done.add(id);
};
const done=new Set();for(const id of Object.keys(clean))visit(id,new Set(),done);
return clean;
}
try{const raw=localStorage.getItem(DRAFT_KEY);if(raw){const data=JSON.parse(raw);placements=validateDraft(data);reviews=validateReviews(data.reviews);}}
catch(e){storageAvailable=false;draftNotice="Almacenamiento local no disponible o borrador inválido. Exporta tu trabajo para conservarlo.";}
function saveDraft(){
try{localStorage.setItem(DRAFT_KEY,JSON.stringify({schema:DRAFT_SCHEMA,placements,reviews}));storageAvailable=true;}
catch(e){storageAvailable=false;draftNotice="No se pudo guardar en el navegador. Exporta el borrador JSON para conservarlo.";}
}
function stagePiece(id,phase){
if(!movable.has(id)||!validPhases.has(phase)){draftNotice="Pieza o fase no válida. No se realizó ningún cambio.";return;}
placements[id]=phase;draftNotice="Ubicación de "+id+" en "+phase+" guardada como BORRADOR, NO INTEGRADA.";saveDraft();
}

'<nav class="command-tabs" aria-label="Menú principal"><div class="command-group">'+[['structure','Estructura'],['connections','Conexiones'],['parts','Inventario'],['floating','Flotantes']].map(([k,l])=>'<button class="tab '+(tab===k?"active":"")+'" data-tab="'+k+'" aria-pressed="'+(tab===k)+'">'+l+'</button>').join("")+'</div><div class="command-group">'+[['pending','Pendientes'],['ideas','Ideas'],['components','Dispersas'],['frozen','FROZEN']].map(([k,l])=>'<button class="tab tray-menu '+(tab===k?"active":"")+'" data-tray="'+k+'" aria-pressed="'+(tab===k)+'">'+l+'</button>').join("")+'</div></nav>'+
'<input id="search" type="search" placeholder="Buscar pieza…" aria-label="Buscar piezas" value="'+escapeHtml(search)+'"></div>'+
'<div class="layout"><aside class="panel sidebar left" id="left">'+rightPanel()+'</aside><section class="panel center" id="arki-workspace" aria-label="Mesa de trabajo azul de ARKI">'+({structure:structure,connections:connections,parts:parts,floating:floating,pending:trayWorkspace,ideas:trayWorkspace,components:trayWorkspace,frozen:trayWorkspace}[tab]||structure)()+'</section><aside class="panel sidebar right" id="right">'+leftPanel()+'</aside></div>'+
'<div class="foot">Fuente: docs/arki-master-map/ARKI_MASTER_MAP_STATE.json · Generada desde la copia local al abrir el acceso directo · NO EVIDENCIA = NO VERDE · No modifica repositorios ni autoridades canónicas.</div>';
app.querySelectorAll("[data-tab]").forEach(el=>el.addEventListener("click",()=>{tab=el.dataset.tab;selected=activePhase;render();}));
app.querySelectorAll("[data-phase]").forEach(el=>el.addEventListener("click",()=>{activePhase=el.dataset.phase;selected=activePhase;tab="structure";render();}));
app.querySelectorAll("[data-assembly]").forEach(el=>el.addEventListener("click",()=>{assembly=el.dataset.assembly;render();}));
app.querySelectorAll("[data-tray]").forEach(el=>el.addEventListener("click",()=>{tray=el.dataset.tray;tab=tray;selected="";render();}));
app.querySelectorAll("[data-inspect]").forEach(el=>el.addEventListener("click",()=>{selected=el.dataset.inspect;render();}));
app.querySelectorAll("[data-drag-piece]").forEach(el=>el.addEventListener("dragstart",e=>{const id=el.dataset.dragPiece;if(!movable.has(id)){e.preventDefault();return;}e.dataTransfer.setData("text/plain",id);e.dataTransfer.effectAllowed="move";}));
const dropZone=app.querySelector("#arki-workspace");
if(dropZone&&tab==="structure"){
dropZone.setAttribute("aria-label","Mesa de trabajo azul de ARKI: puedes soltar aquí una pieza de la bandeja izquierda");
dropZone.addEventListener("dragover",e=>{if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes("text/plain")){e.preventDefault();dropZone.classList.add("drag-over");e.dataTransfer.dropEffect="move";}});
dropZone.addEventListener("dragleave",e=>{if(!dropZone.contains(e.relatedTarget))dropZone.classList.remove("drag-over");});
dropZone.addEventListener("drop",e=>{e.preventDefault();dropZone.classList.remove("drag-over");const id=e.dataTransfer.getData("text/plain");if(movable.has(id)){stagePiece(id,activePhase);selected=id;render();}});
}
app.querySelectorAll("[data-stage]").forEach(el=>el.addEventListener("click",()=>{const picker=app.querySelector("#placement-phase");stagePiece(el.dataset.stage,picker?picker.value:activePhase);render();}));
app.querySelectorAll("[data-unstage]").forEach(el=>el.addEventListener("click",()=>{unstagePiece(el.dataset.unstage);render();}));
app.querySelectorAll("[data-review]").forEach(el=>el.addEventListener("click",()=>{
const get=id=>app.querySelector(id)?.value||"";
recordReview(el.dataset.review,{repo:get("#review-repo"),file:get("#review-file"),sha:get("#review-sha"),test:get("#review-test"),dependencies:get("#review-deps")});render();
}));
app.querySelectorAll("[data-export]").forEach(el=>el.addEventListener("click",()=>{draftFile();render();}));
const importControl=app.querySelector("#draft-import");if(importControl)importControl.addEventListener("change",e=>importDraft(e.target.files&&e.target.files[0]));
app.querySelectorAll("[data-select]").forEach(el=>{const fn=()=>{selected=el.dataset.select;if(/^F\d+$/.test(selected)){activePhase=selected;tab="structure";}else{tab="structure";}render();};el.addEventListener("click",fn);if(el.tagName.toLowerCase()==="g")el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn();}});});
app.querySelector("#search").addEventListener("input",e=>{const pos=e.target.selectionStart;search=e.target.value;render();const inp=app.querySelector("#search");inp.focus();inp.setSelectionRange(pos,pos);});
}
render();
})();
</script>
</body>
</html>
