name: SICL Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: arki_test
          MARIADB_USER: arki_web
          MARIADB_PASSWORD: ci-test-password
          MARIADB_USER_HOST: '%'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Prepare isolated MO22 test storage
        run: mkdir -p "${RUNNER_TEMP}/arki-mo22/objects"

      - name: Run tests
        env:
          SICL_CORE_SERVICE_TOKEN: ci-test-token
          DATABASE_URL: mysql://arki_web:ci-test-password@127.0.0.1:3307/arki_test
          JWT_SECRET: ci-only-session-secret-not-for-production-2026
          VITE_APP_ID: arki-ci-test-app
          ARKI_STORAGE_ROOT: ${{ runner.temp }}/arki-mo22
          ARKI_STORAGE_MODE: local
          ARKI_IDENTITY_MODE: manus
          ARKI_MO22_ENABLE: "0"
        run: pnpm test -- --run

      - name: Build production bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm build
