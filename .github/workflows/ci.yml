name: SICL Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Prepare isolated MO22 test storage
        run: mkdir -p "${RUNNER_TEMP}/arki-mo22/objects"

      - name: Run tests
        env:
          SICL_CORE_SERVICE_TOKEN: ci-test-token
          JWT_SECRET: ci-only-session-secret-not-for-production-2026
          VITE_APP_ID: arki-ci-test-app
          ARKI_STORAGE_ROOT: ${{ runner.temp }}/arki-mo22
          ARKI_STORAGE_MODE: local
          ARKI_IDENTITY_MODE: manus
          ARKI_MO22_ENABLE: "0"
        run: pnpm test -- --run

      - name: Build production bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm build
