name: ARKI Continuity Map

on:
  push:
    branches:
      - main
      - feat/arki-integration-genealogy-20261013
    paths-ignore:
      - 'docs/arki-master-map/ARKI_MAPA_VIVO_CONTINUIDAD.md'
  pull_request:
    branches: [main]
    paths:
      - 'tools/maqueta-viva/arki-continuity-snapshot*'
      - 'docs/arki-master-map/ARKI_CONTINUITY_EVENTS.jsonl'
      - '.github/workflows/arki-continuity-map.yml'
  workflow_dispatch:

# Read-only: validate continuity; publishing requires an explicit reviewed change.
permissions:
  contents: read

concurrency:
  group: arki-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate continuity generator and ledger
        shell: bash
        run: |
          set -o pipefail
          node --version
          git --version
          node --test tools/maqueta-viva/arki-continuity-snapshot.test.cjs 2>&1 | tee arki-continuity-test.log

      - name: Verify committed snapshot is current
        run: node tools/maqueta-viva/arki-continuity-snapshot.cjs --check

      - name: Upload continuity test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arki-continuity-test-diagnostics
          path: arki-continuity-test.log
          if-no-files-found: warn
