name: AV036 recovered capabilities validation
on:
  push:
    branches:
      - experiment/arki-ideas-mapa-vivo-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovered-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated recovered capability tests
        shell: bash
        run: bash experiments/arki-ideas/run-av036-validation.sh
