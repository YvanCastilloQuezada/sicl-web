name: ARKI Research and Trends (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '20 11 * * 1'
permissions:
  contents: read
concurrency:
  group: arki-research-trends-${{ github.ref }}
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest discover -s tools/research-trends -p 'test_*.py' -v
      - name: Restore prior observation snapshot
        uses: actions/cache/restore@v4
        with:
          path: .research-watch-prior/snapshot.json
          key: arki-research-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            arki-research-v1-${{ github.ref_name }}-
      - name: Run external source observation
        id: observe
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/research-trends/watch.py \
            --sources tools/research-trends/sources.json \
            --canonical docs/arki-master-map/ARKI_MASTER_MAP_STATE.json \
            --previous .research-watch-prior/snapshot.json \
            --out-dir .research-watch-output
      - name: Publish evidence report, including partial-source failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arki-research-report-${{ github.run_id }}
          path: .research-watch-output/report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve last observed snapshot (only complete runs)
        if: steps.observe.outcome == 'success'
        run: |
          mkdir -p .research-watch-prior
          cp .research-watch-output/snapshot.json .research-watch-prior/snapshot.json
      - name: Cache last complete observation
        if: steps.observe.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .research-watch-prior/snapshot.json
          key: arki-research-v1-${{ github.ref_name }}-${{ github.run_id }}
      - name: Fail closed on source errors
        if: steps.observe.outcome != 'success'
        run: |
          echo 'Observation failed or sources incomplete. No canonical changes.'
          exit 1
