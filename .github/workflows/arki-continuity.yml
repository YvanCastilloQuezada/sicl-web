name: ARKI Continuity Snapshot
on:
  push:
    branches:
      - feat/arbol-vivo-precedencias-seguras-20261010
    paths-ignore:
      - ARKI_HANDOFF.md
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate handoff from observed Git state
        run: node tools/maqueta-viva/generate-arki-handoff.cjs
      - name: Commit generated root handoff if changed
        shell: bash
        run: |
          if git diff --quiet -- ARKI_HANDOFF.md && git ls-files --error-unmatch ARKI_HANDOFF.md >/dev/null 2>&1; then
            echo "NO_HANDOFF_CHANGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARKI_HANDOFF.md
          git commit -m "chore(continuity): refresh root ARKI handoff [skip ci]"
          git push
