name: GIA CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/arki*.ts'
      - 'server/motoresClient.ts'
      - 'shared/**/*.ts'
      - 'tsconfig.gia.json'
      - 'vitest.gia.config.ts'
      - '.github/workflows/gia-ci.yml'
  push:
    branches: [main]
    paths:
      - 'server/arki*.ts'
      - 'server/motoresClient.ts'
      - 'shared/**/*.ts'
      - 'tsconfig.gia.json'
      - 'vitest.gia.config.ts'
      - '.github/workflows/gia-ci.yml'

jobs:
  type-check-gia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Type check GIA
        run: pnpm exec tsc -p tsconfig.gia.json
      - name: Tests GIA
        run: pnpm exec vitest run --config vitest.gia.config.ts
