name: GIA CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  type-check-gia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Type check GIA
        run: pnpm exec tsc -p tsconfig.gia.json
      - name: Tests GIA
        run: pnpm exec vitest run --config vitest.gia.config.ts
