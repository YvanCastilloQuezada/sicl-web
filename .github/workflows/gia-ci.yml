name: GIA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  type-check-gia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Type check GIA
        run: pnpm exec tsc -p tsconfig.gia.json

  test-gia-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Tests GIA unitarios (sin motores-api)
        run: pnpm exec vitest run server/arkiGia.test.ts server/gia/divergence.test.ts

  # Los tests de integración (GIA-011..025) requieren motores-api.
  # Se ejecutan localmente con motores-api levantado.
  # En CI se marcan como skip por ausencia de motores-api.
  test-gia-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Tests GIA integración (skip si motores-api no responde)
        run: |
          if curl -s --max-time 2 http://127.0.0.1:18771/engines > /dev/null 2>&1; then
            pnpm exec vitest run server/arkiGiaMotores.test.ts server/arkiGiaStructural.test.ts server/arkiGiaStructuralWorld.test.ts server/arkiGiaNsga2.test.ts
          else
            echo "::warning::motores-api no responde en 127.0.0.1:18771. Tests de integración GIA-011..025 NO ejecutados. Ejecutar localmente con motores-api levantado."
            echo "SKIPPED: motores-api no disponible. Tests de integración GIA-011..025 no ejecutados."
            exit 0
          fi
