name: ARKI Assembly Planner
on:
  push:
    branches:
      - 'feat/arbol-vivo-autoensamblaje-*'
      - 'feat/arki-autonomy-*'
  pull_request:
    paths:
      - 'tools/maqueta-viva/arki-assembly-planner.cjs'
      - 'tools/maqueta-viva/test-arki-assembly-planner.cjs'
      - 'tools/maqueta-viva/arki-autonomy-*.cjs'
      - '.github/workflows/arki-assembly-planner.yml'
jobs:
  assembly-planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/maqueta-viva/arki-autonomy-macro-orders.cjs
      - run: node --test tools/maqueta-viva/test-arki-autonomy-macro-orders.cjs
      - run: node --check tools/maqueta-viva/arki-autonomy-memory.cjs
      - run: node --test tools/maqueta-viva/test-arki-autonomy-memory.cjs
      - run: node --check tools/maqueta-viva/arki-autonomy-orchestrator.cjs
      - run: node --test tools/maqueta-viva/test-arki-autonomy-orchestrator.cjs
      - run: node --check tools/maqueta-viva/arki-assembly-planner.cjs
      - run: node --check tools/maqueta-viva/test-arki-assembly-planner.cjs
      - run: node tools/maqueta-viva/test-arki-assembly-planner.cjs
      - run: node --check tools/maqueta-viva/arki-capability-inventory.cjs
      - run: node tools/maqueta-viva/test-arki-capability-inventory.cjs
      - run: node --check tools/maqueta-viva/arki-discovery.cjs
      - run: node tools/maqueta-viva/test-arki-discovery.cjs
      - run: node --check tools/maqueta-viva/arki-assembly-strategies.cjs
      - run: node tools/maqueta-viva/test-arki-assembly-strategies.cjs
      - run: node tools/maqueta-viva/arki-discovery.cjs > /tmp/arki-discovery-report.json
